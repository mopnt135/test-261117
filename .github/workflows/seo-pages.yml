# 글마다 AI 결과(ai/<글번호>.json)와 검색, 공유용 정적 페이지(p/<글번호>/), 썸네일을 만들어 저장소에 올린다.
# 새 글은 Supabase 에 저장되므로, 하루 두 번 확인한다. 바로 반영하려면 Actions 화면에서 "Run workflow" 를 누른다.
# Supabase 가 비어 있으면(지금) demo/posts.json 의 시연용 글로 돈다.
# AI 키는 Secrets 의 AI_API_KEY 에만 둔다. 없으면 시연용 가짜 AI 로 만든다. 기본은 Claude(공식 SDK). 모델은 Variables 의 AI_MODEL, Gemini 로 돌리려면 AI_PROVIDER=gemini.
name: 검색·공유 페이지 만들기

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST
    - cron: "17 9 * * *"    # 매일 18:17 KST
  push:
    branches: [main]
    paths: ["index.html", "scripts/build-pages.js", "scripts/ai-assist.js", "demo/posts.json", "portfolio/profile.md"]

permissions:
  contents: write

concurrency:
  group: seo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # 11-24: 글꼴 내려받기가 13분 넘게 걸려 15분에 두 번 잘렸다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude SDK 와 Playwright 패키지 설치 (빠름)
        run: npm install --no-save --no-package-lock playwright@1.63.0 @anthropic-ai/sdk@1.13.0
      - name: 글 가져올 곳 정하기 (Supabase 가 비어 있으면 시연용 글)
        id: src
        run: |
          if grep -q 'const SUPABASE_URL = "";' index.html; then
            echo "posts=--posts-json demo/posts.json" >> "$GITHUB_OUTPUT"; echo "시연용 글 사용"
          else
            echo "posts=" >> "$GITHUB_OUTPUT"; echo "Supabase 공개글 사용"
          fi
      - name: AI 도우미 테스트 (가짜 AI 서버, 돈 들지 않음. 실패하면 진짜 AI 를 부르지 않고 멈춤)
        run: node tests/ai_test.js
      - name: AI 도우미 (키가 없으면 시연용 가짜 AI)
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
        run: node scripts/ai-assist.js ${{ steps.src.outputs.posts }}
      # AI 결과는 바로 올린다. 뒤의 글꼴 설치가 느려 실행이 잘려도 AI 결과(키 기한 안에 만든 것)는 남는다
      - name: AI 결과 먼저 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai
          if git diff --cached --quiet; then echo "바뀐 AI 결과 없음"; exit 0; fi
          git commit -m "AI 결과 자동 갱신"
          git pull --rebase origin main
          git push
      - name: 한글 글꼴과 브라우저 설치 (썸네일용, 느릴 수 있음)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: 페이지 만들기
        run: node scripts/build-pages.js ${{ steps.src.outputs.posts }}
      - name: 생성기 테스트
        run: node tests/pages_test.js
      - name: 바뀐 것이 있으면 올리기
        run: |
          git add p og sitemap.xml robots.txt ai
          if git diff --cached --quiet; then echo "바뀐 페이지 없음"; exit 0; fi
          git commit -m "검색·공유 페이지 자동 갱신"
          git pull --rebase origin main   # 도는 사이 누가 먼저 올렸으면 그 위에 얹는다
          git push
