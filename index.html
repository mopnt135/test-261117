<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="삼색펜 블로그">
<title>삼색펜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* 레이아웃: 고정 헤더 + 화면 5개(첫 화면, 글 목록, 글 상세, 글쓰기, 관리자). 주소 끝 #이름으로 화면을 바꿈
   강조 3단계: 빨강(1순위) > 주황(2순위) > 민트(3순위) */
:root{
  --bg:#FFFFFF;--fg:#0B0B0B;--muted:#545454;--line:#E2E2E2;--soft:#F4F4F4;
  --red:#D2141B;--on-red:#FFFFFF;
  --orange:#C2410C;--orange-fill:#FF7A1A;--on-orange:#0B0B0B;
  --mint:#0A7A68;--mint-fill:#7EEBD0;--on-mint:#0B0B0B;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --wrap:1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0D0D;--fg:#F5F5F5;--muted:#B0B0B0;--line:#2B2B2B;--soft:#181818;
    --red:#FF4A4F;--on-red:#0D0D0D;
    --orange:#FF9B50;--orange-fill:#FF8A3D;--on-orange:#0D0D0D;
    --mint:#5EEAD4;--mint-fill:#2DD4B0;--on-mint:#0D0D0D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0D0D;--fg:#F5F5F5;--muted:#B0B0B0;--line:#2B2B2B;--soft:#181818;
  --red:#FF4A4F;--on-red:#0D0D0D;
  --orange:#FF9B50;--orange-fill:#FF8A3D;--on-orange:#0D0D0D;
  --mint:#5EEAD4;--mint-fill:#2DD4B0;--on-mint:#0D0D0D;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:2px}
h1:focus{outline:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:8px;background:var(--red);color:var(--on-red);padding:10px 16px;z-index:50;font-weight:700}
.skip:focus{left:16px}
.sr{position:absolute;left:-999px}
.label{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px}
.label::before{content:"";width:8px;height:8px;background:var(--red)}

/* 버튼 3단계 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;background:var(--red);color:var(--on-red);text-decoration:none;border:0;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.sub{background:var(--orange-fill);color:var(--on-orange)}
.btn.sub:hover{background:var(--fg);color:var(--bg)}
.btn.line{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.btn.line:hover{border-color:var(--orange);color:var(--orange);background:transparent}
.btn[disabled]{opacity:.5;cursor:wait}
.link2{font-weight:700;color:var(--orange);background:none;border:0;border-bottom:2px solid currentColor;padding:4px 0;cursor:pointer;text-decoration:none}
.link2:hover{color:var(--fg)}

/* 헤더 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--fg)}
.bar{display:flex;align-items:center;gap:20px;min-height:68px;position:relative}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--f-display);font-weight:900;font-size:23px;letter-spacing:-.02em;flex:none}
.pens{display:flex;gap:3px;align-items:flex-end}
.pens i{display:block;width:6px;border-radius:1px}
.pens i:nth-child(1){height:20px;background:var(--red)}
.pens i:nth-child(2){height:15px;background:var(--orange-fill)}
.pens i:nth-child(3){height:10px;background:var(--mint-fill)}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{text-decoration:none;padding:10px 12px;font-weight:500;min-height:44px;display:flex;align-items:center;white-space:nowrap}
nav.main a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--orange-fill)}
nav.main a:hover{color:var(--orange)}
.search{display:flex;align-items:center;border:2px solid var(--fg);height:44px;width:180px;min-width:0}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;padding:0 12px;height:100%}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--red)}
.search svg{width:18px;height:18px;margin-right:12px;flex:none}
.auth{display:flex;gap:8px;flex:none}
.menu-btn{display:none}
.demo-strip{background:var(--soft);font-size:14px;color:var(--muted)}
.demo-strip .wrap{padding-block:8px;display:flex;gap:8px;align-items:center}
.demo-strip b{color:var(--mint)}

/* 첫 화면 */
.hero{padding-block:52px 40px;border-bottom:1px solid var(--line)}
.hero-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:48px;align-items:end}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,5.4vw,60px);line-height:1.15;letter-spacing:-.03em;margin:14px 0 0;text-wrap:balance}
.hero h1 mark{background:linear-gradient(transparent 62%,var(--red) 62%,var(--red) 90%,transparent 90%);color:inherit;padding:0 2px}
.hero p.lead{font-size:19px;color:var(--muted);margin:0 0 20px;max-width:38ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums;align-items:center}
.hero-actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:24px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line)}
.tile{display:flex;flex-direction:column;gap:4px;padding:24px 24px 24px 0;text-decoration:none;border-right:1px solid var(--line);min-height:120px}
.tile + .tile{padding-left:24px}
.tile:last-child{border-right:0}
.tile b{font-family:var(--f-display);font-size:21px;display:flex;align-items:center;gap:10px}
.tile b::after{content:"→";color:var(--orange);transition:transform .2s}
.tile:hover b::after{transform:translateX(4px)}
.tile span{color:var(--muted);font-size:15px}
.tile.primary b::after{color:var(--red)}

/* 공통 화면 머리 */
.page{padding-block:40px 72px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:2px solid var(--fg)}
.page-head h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.2;margin:8px 0 0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:15px;min-height:44px}
.back:hover{color:var(--orange)}

/* 카테고리 */
.cats{display:flex;gap:8px;flex-wrap:wrap;padding-block:20px 4px}
.chip{font-size:15px;font-weight:500;min-height:40px;padding:0 16px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.chip:hover{border-color:var(--orange);color:var(--orange)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-size:12px;margin-left:6px;opacity:.7}

/* 글 목록 */
.body-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;padding-block:32px 72px}
.body-grid.side-left{grid-template-columns:320px minmax(0,1fr)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:10px}
.sec-head h2{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0}
.posts{list-style:none;margin:0;padding:0}
.post{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;padding-block:26px;border-bottom:1px solid var(--line)}
.post .side{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.post .cat{font-size:14px;font-weight:700;color:var(--orange)}
.post time{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:700;padding:1px 8px;white-space:nowrap;font-family:var(--f-body)}
.badge.notice{background:var(--red);color:var(--on-red)}
.badge.private{background:var(--mint-fill);color:var(--on-mint)}
.badge.public{border:1.5px solid var(--fg)}
.badge.role-pending{background:var(--mint-fill);color:var(--on-mint)}
.badge.role-writer{background:var(--orange-fill);color:var(--on-orange)}
.badge.role-admin{background:var(--red);color:var(--on-red)}
.post h3{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.4;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.post h3 a{text-decoration:none;background:linear-gradient(var(--orange-fill),var(--orange-fill)) 0 100%/0 3px no-repeat;transition:background-size .25s}
.post h3 a:hover{background-size:100% 3px}
.post p{margin:0 0 10px;color:var(--muted);max-width:62ch}
.post .read{font-family:var(--f-mono);font-size:13px;color:var(--mint)}
.empty{padding:36px 0;color:var(--muted)}
.empty strong{color:var(--fg);display:block;font-size:19px;margin-bottom:4px}
.more{margin-top:32px;width:100%;min-height:52px;font-weight:700;background:transparent;color:var(--fg);border:2px solid var(--fg);cursor:pointer}
.more:hover{border-color:var(--orange);color:var(--orange)}

/* 사이드바 */
aside{display:flex;flex-direction:column;gap:40px}
aside h2{font-family:var(--f-display);font-weight:900;font-size:18px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--fg)}
.account{background:var(--fg);color:var(--bg);padding:24px;display:flex;flex-direction:column;gap:14px}
.account h2{border-color:var(--bg);margin:0}
.account p{margin:0;font-size:15px;opacity:.85}
.account .who{font-family:var(--f-mono);font-size:14px;word-break:break-all}
.account .counts{display:flex;gap:16px;font-size:14px;font-variant-numeric:tabular-nums}
.account .btn.line{color:var(--bg);border-color:var(--bg)}
.account .btn.line:hover{color:var(--orange-fill);border-color:var(--orange-fill)}
.account .row{display:flex;gap:8px;flex-wrap:wrap}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:15px}
.rules li{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:start}
.rules .badge{justify-self:start;margin-top:3px}

/* 글 상세 */
.article{max-width:760px}
.article h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,4.6vw,48px);line-height:1.25;letter-spacing:-.03em;margin:16px 0 18px;text-wrap:balance}
.article .meta{padding-bottom:20px;border-bottom:1px solid var(--line)}
.article-body{white-space:pre-wrap;margin:28px 0 0;font-size:18px;line-height:1.9;max-width:65ch}
.article-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px;align-items:center}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:48px;border-top:2px solid var(--fg)}
.pager a{display:flex;flex-direction:column;gap:2px;padding:18px 0;text-decoration:none;min-width:0}
.pager a:last-child{text-align:right;align-items:flex-end;border-left:1px solid var(--line);padding-left:16px}
.pager a:first-child{padding-right:16px}
.pager small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pager span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pager a:hover span{color:var(--orange)}

/* 양식 */
.form{max-width:760px;display:flex;flex-direction:column;gap:20px;padding-top:28px}
.form.narrow{max-width:440px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:15px;font-weight:700}
.field input,.field textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:2px solid var(--fg);padding:10px 12px;min-height:48px;width:100%}
.field textarea{min-height:320px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--red)}
.hint{font-size:13px;color:var(--muted)}
fieldset.field{border:0;padding:0;margin:0}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vis label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);padding:12px;cursor:pointer;font-weight:400}
.vis label b{display:block}
.vis label span{font-size:13px;color:var(--muted)}
.vis input{width:20px;height:20px;min-height:0;margin:3px 0 0;accent-color:var(--fg);flex:none}
.vis label:has(input:checked){border-color:var(--fg);background:var(--soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.msg{font-size:14px;margin:0;min-height:1.4em}
.msg.err{color:var(--red);font-weight:700}
.switch{font-size:14px;color:var(--muted);margin:0}
.switch button{background:none;border:0;color:var(--orange);font-weight:700;cursor:pointer;text-decoration:underline;padding:4px}
.notice-box{max-width:560px;padding:24px;border:2px solid var(--fg);margin-top:28px;display:flex;flex-direction:column;gap:14px}
.notice-box p{margin:0}

/* 관리자 */
.members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-width:760px}
.members li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.members .email{display:block;font-weight:700;word-break:break-all}
.members .since{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.members .btn{min-height:40px;padding:0 14px;font-size:15px}
.stat{display:flex;gap:24px;flex-wrap:wrap;padding-block:20px;font-variant-numeric:tabular-nums}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:28px;line-height:1.2}
.stat span{font-size:14px;color:var(--muted)}

footer{border-top:2px solid var(--fg)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:28px;font-size:14px;color:var(--muted)}
.foot a{color:var(--muted)}

@media (max-width:980px){
  .hero-grid,.body-grid,.body-grid.side-left{grid-template-columns:1fr;gap:32px}
  .search{width:auto;flex:1}
  nav.main{display:none}
  nav.main.open{display:flex;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);border-bottom:2px solid var(--fg);padding:8px max(16px,env(safe-area-inset-left,0px))}
  .menu-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;flex:none}
  .bar{gap:10px}
}
@media (max-width:640px){
  body{font-size:16px}
  .tiles{grid-template-columns:1fr}
  .tile,.tile + .tile{padding:18px 0;border-right:0;border-bottom:1px solid var(--line);min-height:0}
  .tile:last-child{border-bottom:0}
  .post{grid-template-columns:1fr;gap:6px}
  .post .side{flex-direction:row;gap:12px;align-items:center;flex-wrap:wrap}
  .logo .name{display:none}
  .hero{padding-block:36px 32px}
  .auth .btn{padding:0 12px}
  .auth .out{display:none}
  .vis{grid-template-columns:1fr}
  .members li{grid-template-columns:minmax(0,1fr) auto}
  .members .btn{grid-column:1/-1}
  .article-body{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<a class="skip" href="#view">본문으로 바로가기</a>

<header class="site">
  <div class="wrap bar">
    <a class="logo" href="#" aria-label="삼색펜 첫 화면"><span class="pens" aria-hidden="true"><i></i><i></i><i></i></span><span class="name">삼색펜</span></a>
    <nav class="main" id="mainnav" aria-label="주 메뉴">
      <a href="#" data-nav="home">홈</a>
      <a href="#list" data-nav="list">글 목록</a>
      <a href="#write" data-nav="write">글쓰기</a>
      <a href="#admin" data-nav="admin">관리자</a>
    </nav>
    <label class="search" for="q">
      <span class="sr">글 검색</span>
      <input id="q" type="search" placeholder="글 검색" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </label>
    <div class="auth" id="authArea"></div>
    <button class="menu-btn" id="menuBtn" aria-controls="mainnav" aria-expanded="false" aria-label="메뉴 열기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>

<div class="demo-strip" id="demoStrip" hidden>
  <div class="wrap"><b>체험 모드</b>로그인과 글이 이 브라우저에만 저장됩니다. 처음 로그인한 이메일이 관리자가 됩니다.</div>
</div>

<main id="view" tabindex="-1"></main>

<footer>
  <div class="wrap foot">
    <span>© 2026 삼색펜 · 모든 시간은 한국 시간(KST) 기준입니다</span>
    <a href="#admin">관리자 로그인</a>
  </div>
</footer>

<script>
/* ===== 설정: Supabase 프로젝트 정보를 넣으면 실제 로그인과 글 저장이 켜집니다 =====
   비워 두면 체험 모드로 동작합니다. */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

const NOTICE = {
  id:"notice", notice:true, category:"공지", visibility:"public", created_at:"2026-11-17T09:00:00+09:00",
  title:"삼색펜 이용 안내",
  body:`삼색펜에 오신 것을 환영합니다.
이 블로그는 아래 두 가지 규칙으로 운영됩니다.

1. 글쓰기는 관리자가 허용한 사람만 할 수 있습니다.
누구나 회원가입은 할 수 있지만, 가입 직후에는 승인 대기 상태입니다.
관리자가 허용하면 글쓰기 메뉴를 쓸 수 있습니다.
로그인하지 않은 방문자는 공개된 글을 읽을 수만 있습니다.

2. 글은 공개글과 나만보기 글로 나뉩니다.
공개글은 누구나 볼 수 있습니다.
나만보기 글은 글을 쓴 본인이 로그인했을 때만 보입니다.

내가 쓴 글은 글 상세 화면의 수정 버튼으로 고칠 수 있습니다.`
};

const NOTICE_RULES = {
  id:"notice-rules", notice:true, category:"공지", visibility:"public", created_at:"2026-11-17T13:00:00+09:00",
  title:"삼색펜 운영 기준",
  body:`삼색펜을 함께 쓰기 위한 기준입니다.
기준을 어기면 수정 요청, 글 삭제, 경고, 추방 순서로 조치합니다.

불필요한 글의 기준
1. 블로그 주제와 관계없는 광고나 홍보 글
2. 같은 내용을 여러 번 올린 글
3. 다른 사람의 글이나 사진을 출처 없이 옮긴 글
4. 다른 사람의 이름, 연락처 같은 개인정보가 들어간 글
5. 내용 없이 제목만 있거나 의미 없는 글자만 있는 글

질 나쁜 이용자의 기준
1. 다른 사람을 욕하거나 비하하는 사람
2. 성별, 나이, 지역, 장애 등을 이유로 차별하는 사람
3. 불필요한 글을 반복해서 올리는 사람
4. 수정 요청을 받고도 같은 문제를 되풀이하는 사람
5. 다른 사람인 척하거나 계정을 여러 개 만들어 쓰는 사람

조치 방법
1. 글에 문제가 있으면 수정 요청을 보냅니다. 3일 안에 고치지 않으면 글이 숨겨집니다.
2. 심각한 글은 바로 지울 수 있습니다. 지운 글은 14일 동안 복구할 수 있습니다.
3. 이용자 기준을 어기면 경고를 받습니다. 경고가 3회 쌓이면 자동으로 추방됩니다.
4. 추방되면 올린 공개글이 모두 비공개로 바뀝니다.
5. 모든 안내는 블로그에 로그인했을 때 화면으로만 보냅니다.

나만보기 글 안내
나만보기 글은 다른 방문자에게는 보이지 않지만, 관리자는 운영을 위해 볼 수 있습니다.`
};

const ROLE_NAME = {pending:"승인 대기", writer:"글쓴이", admin:"관리자"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => new Date(iso).toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\.\s?/g,".").replace(/\.$/,"");
const mins = t => Math.max(1, Math.round(t.length/500));
const idOf = v => /^\d+$/.test(String(v)) ? Number(v) : v;

/* ===== 저장소: Supabase(실제) 또는 브라우저(체험) ===== */
const REMOTE = !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
const sb = REMOTE ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const must = res => { if (res.error) throw res.error; if (Array.isArray(res.data) && !res.data.length) throw new Error("권한이 없거나 대상이 없습니다"); return res.data; };

const local = (() => {
  const KEY = "samsaekpen-demo-v2"; let mem = {user:null, posts:[], users:{}};
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || mem; } catch { return mem; } };
  const save = d => { mem = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
  return { load, save };
})();

const store = REMOTE ? {
  async session(){ const {data} = await sb.auth.getSession(); return data.session?.user || null; },
  onChange(cb){ sb.auth.onAuthStateChange((_e, s) => cb(s?.user || null)); },
  async signIn(email, pw){ const {data, error} = await sb.auth.signInWithPassword({email, password:pw}); if (error) throw error; return data.user; },
  async signUp(email, pw){ const {data, error} = await sb.auth.signUp({email, password:pw}); if (error) throw error; return data.session ? data.user : null; },
  async signOut(){ await sb.auth.signOut(); },
  async role(u){ const {data, error} = await sb.from("profiles").select("role").eq("id", u.id).maybeSingle(); if (error) throw error; return data?.role || "pending"; },
  async members(){ return must(await sb.from("profiles").select("id,email,role,created_at").order("created_at",{ascending:true})); },
  async setRole(id, role){ must(await sb.from("profiles").update({role}).eq("id", id).select("id")); },
  async list(){ const {data, error} = await sb.from("posts").select("id,author_id,title,body,category,visibility,created_at,updated_at").order("created_at",{ascending:false}).limit(500); if (error) throw error; return data; },
  async create(p){ return must(await sb.from("posts").insert(p).select("id"))[0].id; },
  async update(id, p){ must(await sb.from("posts").update(p).eq("id", id).select("id")); },
  async remove(id){ must(await sb.from("posts").delete().eq("id", id).select("id")); }
} : {
  async session(){ return local.load().user; },
  onChange(){},
  async signIn(email){
    const d = local.load(), key = email.toLowerCase();
    if (!d.users[key]) d.users[key] = {id:"demo:"+key, email, role: Object.keys(d.users).length ? "pending" : "admin", created_at:new Date().toISOString()};
    d.user = {id:d.users[key].id, email}; local.save(d); return d.user;
  },
  async signUp(email, pw){ return this.signIn(email, pw); },
  async signOut(){ const d = local.load(); d.user = null; local.save(d); },
  async role(u){ const m = Object.values(local.load().users).find(x => x.id === u.id); return m ? m.role : "pending"; },
  async members(){ return Object.values(local.load().users).sort((a,b) => a.created_at.localeCompare(b.created_at)); },
  async setRole(id, role){ const d = local.load(); const m = Object.values(d.users).find(x => x.id === id); if (m) m.role = role; local.save(d); },
  async list(){ const d = local.load(); return d.posts.filter(p => p.visibility === "public" || (d.user && p.author_id === d.user.id)); },
  async create(p){ const d = local.load(); const id = Date.now(); d.posts.unshift({...p, id, author_id:d.user.id, created_at:new Date().toISOString(), updated_at:null}); local.save(d); return id; },
  async update(id, p){ const d = local.load(); const x = d.posts.find(q => q.id === id && q.author_id === d.user.id); if (!x) throw new Error("no"); Object.assign(x, p); local.save(d); },
  async remove(id){ const d = local.load(); d.posts = d.posts.filter(p => !(p.id === id && p.author_id === d.user.id)); local.save(d); }
};

/* ===== 상태 ===== */
let user = null, role = null, members = [], posts = [], loading = true, loadError = false;
let cat = "전체", q = "", shown = 10, signupMode = false, afterLogin = "#", firstRender = true;
const canWrite = () => !!user && (role === "writer" || role === "admin");
const isAdmin = () => !!user && role === "admin";

const findPost = id => allPosts().find(p => String(p.id) === String(id));

/* ===== 주소 → 화면 ===== */
function parseRoute(){
  const h = location.hash.replace(/^#/, "");
  let m;
  if (!h) return {name:"home"};
  if (h === "list") return {name:"list"};
  if (h === "write") return {name:"write"};
  if (h === "login") return {name:"login"};
  if (h === "admin") return {name:"admin"};
  if ((m = h.match(/^post-([\w-]+)$/))) return {name:"post", id:m[1]};
  if ((m = h.match(/^edit-([\w-]+)$/))) return {name:"edit", id:m[1]};
  return {name:"home"};
}
const go = hash => { if (location.hash === hash || (hash === "#" && !location.hash)) render(); else location.hash = hash; };

        <fieldset class="field"><legend>공개 범위</legend><div class="vis">
          <label><input type="radio" name="vis" id="visPublic" value="public" ${v.visibility!=="private"?"checked":""}><span><b>공개</b>누구나 읽을 수 있어요</span></label>
          <label><input type="radio" name="vis" id="visPrivate" value="private" ${v.visibility==="private"?"checked":""}><span><b>나만보기</b>로그인한 나만 볼 수 있어요</span></label>
        </div></fieldset>
        <div class="field"><label for="wBody">내용</label><textarea id="wBody" required>${esc(v.body)}</textarea></div>
        <p class="msg" id="writeMsg" role="status"></p>
        <div class="actions"><button class="btn" type="submit" id="writeSubmit">${editing ? "수정 저장" : "올리기"}</button><a class="btn line" href="${editing ? `#post-${esc(p.id)}` : "#"}">취소</a></div>
      </form></div>`;
  },

  login(){
    if (user) return `<div class="wrap page">${head("이미 로그인했어요", "로그인")}
      <div class="notice-box"><p class="who">${esc(user.email)}</p><div class="actions"><a class="btn sub" href="#">첫 화면으로</a><button class="btn line" data-act="logout">로그아웃</button></div></div></div>`;
    return `<div class="wrap page">${head(signupMode ? "회원가입" : "로그인", "계정")}${loginForm(false)}</div>`;
  },

  admin(){
    if (!user) { afterLogin = "#admin"; return `<div class="wrap page">${head("관리자 로그인", "관리자")}${loginForm(true)}</div>`; }
    if (!isAdmin()) return `<div class="wrap page">${head("관리자 계정이 아닙니다", "관리자")}
      <div class="notice-box"><p>${esc(user.email)} 계정은 <span class="badge role-${role || "pending"}">${ROLE_NAME[role] || "승인 대기"}</span> 등급이에요. 관리자 계정으로 다시 로그인해 주세요.</p>
      <div class="actions"><button class="btn line" data-act="logout" data-next="#admin">로그아웃</button></div></div></div>`;
    const cnt = r => members.filter(m => m.role === r).length;
    return `<div class="wrap page">${head("글쓴이 관리", "관리자")}
      <div class="stat"><div><b>${cnt("pending")}</b><span>승인 대기</span></div><div><b>${cnt("writer")}</b><span>글쓴이</span></div><div><b>${cnt("admin")}</b><span>관리자</span></div></div>
      <p class="hint" style="margin:0 0 8px">회원가입한 사람은 모두 승인 대기로 시작합니다. 허용한 사람만 글을 쓰고 고칠 수 있습니다.</p>
      <ul class="members">${members.length ? members.map(m => `
        <li><div><span class="email">${esc(m.email || "(이메일 없음)")}</span><span class="since">가입 ${fmt(m.created_at)}</span></div>
          <span class="badge role-${esc(m.role)}">${ROLE_NAME[m.role] || esc(m.role)}</span>
          ${m.role === "admin" ? "" : m.role === "writer"
            ? `<button class="btn line" data-role="pending" data-uid="${esc(m.id)}">허용 취소</button>`
            : `<button class="btn sub" data-role="writer" data-uid="${esc(m.id)}">허용</button>`}
        </li>`).join("") : `<li><span>가입한 사람이 아직 없습니다.</span></li>`}</ul>
      <p class="msg" id="adminMsg" role="status"></p></div>`;
  }
};

/* ===== 그리기 ===== */
function renderHeader(r){
  $("authArea").innerHTML = !user
    ? `<a class="btn line" href="#login">로그인</a>`
    : (canWrite() ? `<a class="btn" href="#write">글쓰기</a>` : "") + `<button class="btn line ${canWrite() ? "out" : ""}" data-act="logout">로그아웃</button>`;
  const navName = r.name === "post" ? "list" : r.name === "edit" ? "write" : r.name === "login" ? "" : r.name;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === navName ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
}
function render(){
  const r = parseRoute();
  renderHeader(r);
  const html = (r.name === "edit" ? views.write : views[r.name])(r);
  $("view").innerHTML = html;
  const titles = {home:"삼색펜", list:"글 목록 · 삼색펜", write:"글쓰기 · 삼색펜", login:"로그인 · 삼색펜", admin:"관리자 · 삼색펜", edit:"글 수정 · 삼색펜"};
  document.title = r.name === "post" ? `${findPost(r.id)?.title || "글"} · 삼색펜` : titles[r.name];
}
function show(){  /* 화면 전환: 맨 위로 + 제목에 초점 */
  render();
  $("mainnav").classList.remove("open");
  if (!firstRender) { window.scrollTo(0, 0); const h = $("view").querySelector("h1"); if (h) h.focus({preventScroll:true}); }
  firstRender = false;
}
async function refresh(){
  loading = true; render();
  try { role = user ? await store.role(user) : null; } catch (err) { console.error(err); role = "pending"; }
  try { members = isAdmin() ? await store.members() : []; } catch (err) { console.error(err); members = []; }
  try { posts = await store.list(); loadError = false; } catch (err) { console.error(err); posts = []; loadError = true; }
  loading = false; render();
}

function msg(id, text, err){ const el = $(id); if (!el) return; el.textContent = text; el.className = "msg" + (err ? " err" : ""); }
function authError(e){
  const m = (e && e.message || "").toLowerCase();
  if (m.includes("invalid login")) return "이메일 또는 비밀번호가 맞지 않습니다.";
  if (m.includes("email not confirmed")) return "메일함에서 인증 링크를 먼저 눌러 주세요.";
  if (m.includes("already registered")) return "이미 가입된 이메일입니다. 로그인해 주세요.";
  if (m.includes("signups not allowed")) return "지금은 회원가입을 받지 않습니다.";
  return "처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.";
}

/* ===== 이벤트 ===== */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const act = t.dataset.act;
  if (act === "logout") { await store.signOut(); user = null; role = null; members = []; await refresh(); return go(t.dataset.next || "#"); }
  if (act === "toggleSignup") { signupMode = !signupMode; return render(); }
  if (act === "more") { shown += 10; return render(); }
  if (t.classList.contains("chip")) { cat = t.dataset.c; shown = 10; return render(); }
  if (act === "delete") {
    if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "한 번 더 누르면 삭제됩니다"; return; }
    t.disabled = true;
    try { await store.remove(idOf(t.dataset.id)); await refresh(); go("#list"); }
    catch (err) { console.error(err); t.disabled = false; msg("postMsg", "삭제하지 못했습니다. 다시 시도해 주세요.", true); }
    return;
  }
  if (t.dataset.role && t.dataset.uid) {
    t.disabled = true;
    try {
      await store.setRole(t.dataset.uid, t.dataset.role);
      members = await store.members(); render();
      msg("adminMsg", t.dataset.role === "writer" ? "글쓰기를 허용했습니다." : "글쓰기 허용을 취소했습니다.");
    } catch (err) { console.error(err); t.disabled = false; msg("adminMsg", "바꾸지 못했습니다. 관리자 계정인지 확인해 주세요.", true); }
  }
});

document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  if (f.id === "loginForm") {
    const email = $("lEmail").value.trim(), pw = $("lPw").value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg("loginMsg", "이메일 형식을 확인해 주세요. 예: name@example.com", true);
    if (pw.length < 6) return msg("loginMsg", "비밀번호는 6자 이상이어야 합니다.", true);
    const b = $("loginSubmit"); b.disabled = true;
    const adminScreen = parseRoute().name === "admin";
    try {
      const u = (signupMode && !adminScreen) ? await store.signUp(email, pw) : await store.signIn(email, pw);
      if (!u) { b.disabled = false; return msg("loginMsg", "가입 신청이 접수됐습니다. 메일함에서 인증 링크를 누른 뒤 로그인해 주세요."); }
      user = u; signupMode = false;
      const next = adminScreen ? "#admin" : (afterLogin && afterLogin !== "#login" ? afterLogin : "#");
      afterLogin = "#";
      await refresh(); go(next);
    } catch (err) { console.error(err); b.disabled = false; msg("loginMsg", authError(err), true); }
  }
  if (f.id === "writeForm") {
    if (!canWrite()) return;
    const editId = f.dataset.edit;
    const title = $("wTitle").value.trim(), body = $("wBody").value.trim();
    const category = $("wCat").value.trim() || "일반";
    const visibility = $("visPrivate").checked ? "private" : "public";
    if (!title) return msg("writeMsg", "제목을 입력해 주세요.", true);
    if (!body) return msg("writeMsg", "내용을 입력해 주세요.", true);
    if (category === "공지" || category === "나만보기") return msg("writeMsg", "공지와 나만보기는 카테고리 이름으로 쓸 수 없습니다.", true);
    const b = $("writeSubmit"); b.disabled = true;
    try {
      let id;
      if (editId) { id = idOf(editId); await store.update(id, {title, body, category, visibility, updated_at:new Date().toISOString()}); }
      else id = await store.create({title, body, category, visibility});
      cat = "전체"; await refresh(); go(`#post-${id}`);
    } catch (err) { console.error(err); b.disabled = false; msg("writeMsg", "저장하지 못했습니다. 글쓰기 허용 상태를 확인하고 다시 시도해 주세요.", true); }
  }
});

$("q").addEventListener("input", e => {
  q = e.target.value.trim().toLowerCase(); shown = 10;
  if (parseRoute().name !== "list") location.hash = "#list"; else render();
});
$("menuBtn").addEventListener("click", e => {
  const open = $("mainnav").classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", open);
  e.currentTarget.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
});
window.addEventListener("hashchange", () => { if (parseRoute().name !== "login") signupMode = false; show(); });

/* ===== 시작 ===== */
(async () => {
  $("demoStrip").hidden = REMOTE;
  show();
  try { user = await store.session(); } catch { user = null; }
  store.onChange(u => { const changed = (u && u.id) !== (user && user.id); user = u; if (changed) refresh(); });
  await refresh();
})();
</script>
</body>
</html>
