/* ===== 포트폴리오 안내 챗봇 =====
   답은 ai/chatbot/qa.js(자동 실행이 AI 로 미리 만든 파일)에만 있다. 방문자가 물어도 AI 를 부르지 않는다(규칙 11).
   ready 가 아니거나 파일이 없으면 말풍선을 보이지 않는다. 글자는 textContent 로만 넣는다(HTML 로 해석하지 않음).
   방문 통계에는 질문 번호와 맞았는지만 보낸다. 방문자가 적은 글자는 보내지 않는다. */
const chatbot = (() => {
  let qa = null, started = false;
  const fab = $("chatFab"), panel = $("chatPanel"), log = $("chatLog"), chips = $("chatChips"), input = $("chatQ"), fold = $("chatChipsToggle");
  // 준비된 질문 영역 접기: 답을 보면 접어서 답과 그림 자리를 넓힌다. 누르면 다시 펼친다
  function setChips(openIt) {
    chips.hidden = !openIt; fold.setAttribute("aria-expanded", String(openIt));
    fold.textContent = openIt ? "준비된 질문 접기" : `준비된 질문 보기 (${qa ? qa.items.filter(x => x.chip).length : 0}개)`;
    log.scrollTop = log.scrollHeight; // 영역이 열리고 닫히며 대화 칸 높이가 바뀌어도 마지막 말이 보이게
  }
  // 챗봇 말은 왼쪽에 블로그 로고 얼굴을 붙인다(11-25). 글자는 textContent 로만 넣는다
  const say = (who, text) => {
    const el = document.createElement("div"); el.className = `bubble ${who}`; el.textContent = text;
    if (who === "bot") {
      const row = document.createElement("div"); row.className = "bot-row";
      const face = document.createElement("span"); face.className = "bot-face"; face.setAttribute("aria-hidden", "true");
      const img = document.createElement("img"); img.src = "assets/logo.png"; img.alt = ""; face.appendChild(img);
      row.append(face, el); log.appendChild(row);
    } else log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  };
  // 낱말 줄기: 끝의 조사와 어미(요, 는, 를, 했어 …)를 떼어 "얼마예요"와 "얼마"가 같게 한다
  const TAILS = ["했나요", "인가요", "이에요", "입니다", "했어요", "였어요", "했어", "예요", "에요", "어요", "아요", "나요", "까요", "해요", "해줘", "줘요", "이야", "으로", "에서", "한테", "은", "는", "이", "가", "을", "를", "에", "의", "도", "로", "와", "과", "요", "야", "줘", "죠", "지"];
  const stem = w => { for (const t of TAILS) if (w.length - t.length >= 2 && w.endsWith(t)) return w.slice(0, -t.length); return w; };
  const words = t => (String(t).toLowerCase().match(/[가-힣a-z0-9]{2,}/g) || []).map(stem);
  // 답 아래 그림: 저장소 안 assets/portfolio/ 의 그림만. 영상은 한 장면 그림(썸네일)만 보이고 재생하지 않는다
  const MEDIA_SRC = /^assets\/portfolio\/[A-Za-z0-9._-]+\.(jpe?g|png|gif|webp)$/i;
  const media = list => (Array.isArray(list) ? list : []).filter(m => m && MEDIA_SRC.test(String(m.src)) && !String(m.src).includes(".."))
    .slice(0, 6).map(m => ({ src: String(m.src), alt: String(m.alt || "포트폴리오 그림").slice(0, 80), video: m.video === true }));
  // 블로그 글로 만든 답이면 그 글로 가는 링크를 붙인다
  function showPost(id) {
    if (!id) return;
    const a = document.createElement("a"); a.className = "chat-post"; a.href = `#post-${id}`; a.textContent = "이 글 읽기";
    a.addEventListener("click", close);
    log.appendChild(a); log.scrollTop = log.scrollHeight;
  }
  function showMedia(list) {
    if (!list.length) return;
    const box = document.createElement("div"); box.className = "chat-media";
    list.forEach(m => {
      const fig = document.createElement("figure"); fig.className = m.video ? "is-video" : "";
      const img = document.createElement("img"); img.src = m.src; img.alt = m.alt; img.loading = "lazy"; img.decoding = "async";
      img.addEventListener("load", () => { log.scrollTop = log.scrollHeight; });
      fig.appendChild(img);
      if (m.video) { const tag = document.createElement("span"); tag.className = "chat-media-tag"; tag.textContent = "영상 미리보기 · 재생 안 됨"; fig.appendChild(tag); }
      const cap = document.createElement("figcaption"); cap.textContent = m.alt; fig.appendChild(cap);
      box.appendChild(fig);
    });
    log.appendChild(box); log.scrollTop = log.scrollHeight;
  }
  const ASK = new Set(["어떤", "무엇", "무엇을", "뭐야", "뭔가요", "뭐예요", "어떻게", "알려", "주세요", "알려줘", "궁금해요", "있나요", "인가요", "있어요", "해요", "하나요", "그럼", "혹시", "좀", "대해", "대해서", "어때", "어떤가", "어떻", "보여", "보여주", "알려주", "주세", "궁금", "말해", "설명", "부탁", "오늘", "지금", "뭐예", "뭐에", "뭔가", "뭐하", "있어", "있나", "할수", "수있"]); // 어느 질문에나 나오는 말
  const POST_ID = /^[\w-]{1,64}$/;
  const isAsk = w => ASK.has(w) || [...ASK].some(a => a.length >= 2 && w.startsWith(a)); // "알려주세요" 처럼 흔한 말로 시작하면 흔한 말 // 어느 질문에나 나오는 말은 맞춤에 쓰지 않는다
  function load() {
    const sc = document.createElement("script");
    sc.src = "ai/chatbot/qa.js"; sc.async = true;
    sc.onload = () => {
      const d = window.CHATBOT_QA;
      if (!d || d.ready !== true || !Array.isArray(d.items) || !d.items.length) return;
      qa = { greeting: String(d.greeting || ""), items: d.items.filter(x => x && x.q && x.a).slice(0, 45).map(x => {
        const alts = (Array.isArray(x.alts) ? x.alts : []).map(String).slice(0, 8);
        return { q: String(x.q), a: String(x.a), media: media(x.media), chip: x.chip === true, post: POST_ID.test(String(x.post_id || "")) ? String(x.post_id) : "",
          keys: (Array.isArray(x.keywords) ? x.keywords : []).map(k => String(k).toLowerCase()),
          // 질문과 "다르게 묻는 말" 의 낱말로 찾는다(겹치는 낱말은 한 번만)
          qws: [...new Set([x.q, ...alts].flatMap(words))].filter(w => !isAsk(w)),
          aws: [...new Set(words(x.a))].filter(w => !isAsk(w)) }; // 답 글의 낱말도 약하게(0.5) 찾는다
      }) };
      if (!qa.items.length) return;
      if (!qa.items.some(x => x.chip)) qa.items.slice(0, 8).forEach(x => { x.chip = true; }); // 예전 답 파일(대표 표시 없음)은 앞의 8개
      fab.hidden = false; document.body.classList.add("has-chat");
    };
    document.head.appendChild(sc);
  }
  function open() {
    panel.hidden = false; fab.setAttribute("aria-expanded", "true");
    if (!started) {
      started = true;
      say("bot", qa.greeting || "안녕하세요. 궁금한 것을 골라 주세요.");
      qa.items.forEach((x, i) => { if (!x.chip) return; const b = document.createElement("button"); b.type = "button"; b.textContent = x.q; b.dataset.i = i; chips.appendChild(b); });
    }
    analytics.track("chatbot_open", {});
    $("chatClose").focus();
  }
  function close() { panel.hidden = true; fab.setAttribute("aria-expanded", "false"); fab.focus(); }
  function answer(i, source) { const x = qa.items[i]; setChips(false); say("user", x.q); say("bot", x.a); showMedia(x.media); showPost(x.post); analytics.track("chatbot_question", { q_index: i + 1, source, matched: true }); }
  // 비슷한 말: 적은 말에 이 낱말이 있으면 오른쪽 낱말로도 찾는다(적은 말 쪽에만 적용)
  const SAME = { "돈": ["비용"], "얼마": ["비용"], "가격": ["비용"], "운영비": ["비용"], "공짜": ["무료", "비용"], "모델": ["도구", "ai"], "기술": ["도구"], "툴": ["도구"],
    "연락처": ["연락", "이메일"], "메일": ["이메일"], "모바일": ["휴대폰"], "폰": ["휴대폰"], "핸드폰": ["휴대폰"], "작업물": ["작품", "포트폴리오"], "만든이": ["주인"], "운영자": ["주인"], "뜻": ["이름", "의미"], "의미": ["이름"] };
  function typed(text) {
    const t = text.trim(); if (!t) return;
    const low = t.toLowerCase();
    // 한 글자라 낱말로 안 잡히는 "돈", "폰", "뜻" 은 따로 챙긴다
    const ws = [...words(t), ...["돈", "폰", "뜻"].filter(w => new RegExp(`(^|[^가-힣])${w}([^가-힣]|[이은을도]|$)`).test(low))];
    let best = -1, score = 0;
    // 점수: 적은 낱말마다, 찾을 낱말(keywords)에 맞으면 2, 질문과 다르게 묻는 말에 맞으면 1 을 더한다(둘 다면 3).
    // 둘 다 없고 답 글에만 있으면 0.5. 여러 답에 두루 나오는 낱말("블로그")은 덜 치고, 드문 낱말("누가")은 더 친다
    const latin = w => /^[a-z0-9]+$/.test(w);
    // 영어 낱말은 통째로 같을 때만("ai" 가 "aipm" 에 걸리지 않게), 한글은 한쪽이 다른 쪽을 품으면 같은 말로 본다
    const like = (a, b) => a.length >= 2 && b.length >= 2 && (latin(a) || latin(b) ? a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a))) : (a.includes(b) || b.includes(a)));
    const keyHit = (x, w) => x.keys.some(k => like(stem(k), w) || (latin(w) && stem(k).split(/(?=[A-Z가-힣])/).some(p => p === w)));
    // 찾을 낱말과 글자까지 똑같으면 0.5 더 준다("회원가입" 이 "회원" 보다 "회원가입" 답에 가게)
    const one = (x, w) => { const k = keyHit(x, w) ? (x.keys.some(v => stem(v) === w) ? 2.5 : 2) : 0, q = x.qws.some(v => like(v, w)) ? 1 : 0; return k + q || (x.aws.some(v => like(v, w)) ? 0.5 : 0); };
    const N = qa.items.length;
    // 낱말마다 [그 낱말, 비슷한 말들] 한 묶음. 묶음 안에서 가장 잘 맞는 것을 친다
    const groups = [...new Set(ws.filter(w => !isAsk(w)))].map(w => [w, ...(SAME[w] || [])]);
    const idf = w => Math.max(Math.log((N + 1) / (qa.items.filter(x => one(x, w)).length + 0.5)), 0.1);
    const gs = (x, g) => Math.max(...g.map(w => one(x, w) * idf(w)));
    qa.items.forEach((x, i) => {
      const sc = groups.reduce((s, g) => s + gs(x, g), 0) + (x.keys.some(k => k.length >= 2 && low.includes(k)) ? 0.5 : 0);
      if (sc > score) { score = sc; best = i; }
    });
    // 적은 말의 낱말 묶음 중 절반도 안 맞으면 "범위 밖". 11-25: "포트폴리오" 처럼 여러 답에 두루 나오는 주제어도
    // 블로그와 이어지는 말이면 답하도록, 예전의 최소 점수(1점) 조건은 뺐다
    if (best >= 0 && groups.filter(g => g.some(w => one(qa.items[best], w))).length * 2 < groups.length) best = -1;
    setChips(false); say("user", t);
    if (best >= 0) { say("bot", qa.items[best].a); showMedia(qa.items[best].media); showPost(qa.items[best].post); analytics.track("chatbot_question", { q_index: best + 1, source: "typed", matched: true }); }
    else { say("bot", "저는 이 블로그와 포트폴리오에 관한 질문에만 답할 수 있어요. 다르게 물어보거나 아래 준비된 질문을 골라 주세요."); setChips(true); analytics.track("chatbot_question", { source: "typed", matched: false }); }
  }
  fab.addEventListener("click", () => panel.hidden ? open() : close());
  $("chatClose").addEventListener("click", close);
  fold.addEventListener("click", () => { setChips(chips.hidden); if (!chips.hidden) chips.scrollTop = 0; });
  chips.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) answer(Number(b.dataset.i), "chip"); });
  $("chatForm").addEventListener("submit", e => { e.preventDefault(); typed(input.value); input.value = ""; input.focus(); });
  panel.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  return { load };
})();

/* ===== 시작 ===== */
(async () => {
  chatbot.load();
  analytics.start(); renderGaToggle();
  $("demoStrip").hidden = REMOTE;
  show();
  try { user = await store.session(); } catch { user = null; }
  store.onChange(u => { const changed = (u && u.id) !== (user && user.id); user = u; if (changed) refresh(); });
  await refresh();
})();
</script>
