<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* 레이아웃: 고정 헤더 + 화면 5개(첫 화면, 글 목록, 글 상세, 글쓰기, 관리자). 주소 끝 #이름으로 화면을 바꿈
   변수 이름은 예전 이름(--red 등)을 그대로 씀: --red=강조색, --orange/--mint=문양색 */
/* 색 (2026-11-24 변경). 밝은 모드: 베이스 #FFFFF0, 글자 #2B2622, 문양 #2F3E63, 강조 #E5584B
     다크 모드: 베이스 #353839, 글자 #FFFFFF, 문양 #D5E8F5, 강조 #C2185B
     강조색은 글자 대비가 모자라(3.6:1, 2.0:1) 칠하는 곳(버튼, 배지, 밑줄 표시, 로고)에만 쓴다. 글자, 테두리, 포커스는 문양색
     --muted, --line, --soft, --mint-fill 은 위 색을 섞어 만든 보조 색. --danger 는 강조색과 같다(예전 빨강은 없앰) */
:root{
  --bg:#FFFFF0;--fg:#2B2622;--muted:#6B6760;--line:#C1C5C6;--soft:#F3F3E8;
  --red:#E5584B;--on-red:#2B2622;
  --orange:#2F3E63;--orange-fill:#2F3E63;--on-orange:#FFFFF0;
  --mint:#2F3E63;--mint-fill:#E6E8DF;--on-mint:#2F3E63;
  --danger:#E5584B;--on-danger:#2B2622;
  --footer-bg:#2F3E63;--on-footer:#FFFFF0;--footer-hover:#D5E8F5;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --wrap:1180px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#353839;--fg:#FFFFFF;--muted:#C2C3C4;--line:#5D6468;--soft:#2D3030;
    --red:#C2185B;--on-red:#FFFFFF;
    --orange:#D5E8F5;--orange-fill:#D5E8F5;--on-orange:#353839;
    --mint:#D5E8F5;--mint-fill:#4D5255;--on-mint:#FFFFFF;
    --danger:#C2185B;--on-danger:#FFFFFF;
    --footer-bg:#2F3E63;--on-footer:#FFFFFF;--footer-hover:#D5E8F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#353839;--fg:#FFFFFF;--muted:#C2C3C4;--line:#5D6468;--soft:#2D3030;
  --red:#C2185B;--on-red:#FFFFFF;
  --orange:#D5E8F5;--orange-fill:#D5E8F5;--on-orange:#353839;
  --mint:#D5E8F5;--mint-fill:#4D5255;--on-mint:#FFFFFF;
  --danger:#C2185B;--on-danger:#FFFFFF;
  --footer-bg:#2F3E63;--on-footer:#FFFFFF;--footer-hover:#D5E8F5;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:2px}
h1:focus{outline:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-999px;top:8px;background:var(--red);color:var(--on-red);padding:10px 16px;z-index:50;font-weight:700}
.skip:focus{left:16px}
.sr{position:absolute;left:-999px}
.label{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:8px}
.label::before{content:"";width:8px;height:8px;background:var(--red)}

/* 버튼 3단계 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;background:var(--red);color:var(--on-red);text-decoration:none;border:0;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.sub{background:var(--orange-fill);color:var(--on-orange)}
.btn.sub:hover{background:var(--fg);color:var(--bg)}
.btn.line{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.btn.line:hover{border-color:var(--orange);color:var(--orange);background:transparent}
.btn[disabled]{opacity:.5;cursor:wait}
.link2{font-weight:700;color:var(--orange);background:none;border:0;border-bottom:2px solid currentColor;padding:4px 0;cursor:pointer;text-decoration:none}
.link2:hover{color:var(--fg)}

/* 헤더 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--fg)}
.bar{display:flex;align-items:center;gap:20px;min-height:68px;position:relative}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--f-display);font-weight:900;font-size:23px;letter-spacing:-.02em;flex:none}
.logo-img{display:block;height:40px;width:auto}
.logo .name{display:flex;flex-direction:column;line-height:1.1}
/* 'THINK & MAKE': 로고 톱니와 같은 금색 #B8862B. 로고 그림의 색이라 기본 색 규칙 밖 */
.tagline{font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.28em;color:#B8862B;margin-top:3px} /* 전구와 톱니 로고(사용자 제공, 배경 투명). 밝은·다크 모드 같은 그림 */
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{text-decoration:none;padding:10px 12px;font-weight:500;min-height:44px;display:flex;align-items:center;white-space:nowrap}
nav.main a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--orange-fill)}
nav.main a:hover{color:var(--orange)}
/* 글 목록 소메뉴(11-25): 컴퓨터는 글 목록에 마우스를 올리거나 Tab 으로 들어가면 아래로 펼친다 */
.nav-group{position:relative;display:flex}
.nav-group .sub{display:none;position:absolute;top:100%;left:0;z-index:30;min-width:180px;flex-direction:column;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.12)}
.nav-group:hover .sub,.nav-group:focus-within .sub{display:flex}
.nav-group .sub a{border-radius:6px}
.nav-group .sub a[aria-current="page"]{box-shadow:inset 3px 0 0 var(--orange-fill)}
.nav-group:has(.sub a[aria-current="page"]) > a{box-shadow:inset 0 -3px 0 var(--orange-fill)}
.search{display:flex;align-items:center;border:2px solid var(--fg);height:44px;width:180px;min-width:0}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;padding:0 12px;height:100%}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--orange)}
.search svg{width:18px;height:18px;margin-right:12px;flex:none}
.auth{display:flex;gap:8px;flex:none}
.menu-btn{display:none}
.demo-strip{background:var(--soft);font-size:14px;color:var(--muted)}
.demo-strip .wrap{padding-block:8px;display:flex;gap:8px;align-items:center}
.demo-strip b{color:var(--mint)}

/* 포트폴리오 안내 챗봇: 오른쪽 아래 말풍선 버튼과 대화 창 */
.chat-fab{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 20px 0 6px;border:0;border-radius:999px;background:var(--orange-fill);color:var(--on-orange);font:inherit;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer}
/* 11-25: 말풍선 그림 대신 블로그 로고를 둥근 얼굴(아바타)처럼. 로고와 대화하는 느낌 */
.fab-avatar{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.fab-avatar img{width:auto;height:32px;display:block}
.chat-fab:hover .fab-avatar img{transform:rotate(-8deg);transition:transform .2s}
.chat-fab[aria-expanded="true"]{background:var(--fg);color:var(--bg)}
.chat-panel{position:fixed;right:20px;bottom:84px;z-index:61;width:min(380px,calc(100vw - 32px));max-height:min(560px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.24);overflow:hidden}
.chat-panel[hidden],.chat-fab[hidden]{display:none}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 16px;background:var(--orange-fill);color:var(--on-orange)}
.chat-head h2{margin:0;font-size:16px;font-family:var(--f-display)}
.chat-close{min-width:44px;min-height:44px;background:transparent;border:0;color:inherit;font-size:24px;cursor:pointer}
.chat-log{flex:1;min-height:120px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:10px 12px;font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.bot{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:12px 12px 12px 4px}
.bot-row{align-self:flex-start;display:flex;align-items:flex-end;gap:8px;max-width:92%}
.bot-row .bubble{max-width:none;min-width:0}
.bot-face{flex:none;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.bot-face img{height:22px;width:auto;display:block}
.chat-media{align-self:flex-start;width:calc(85% - 40px);margin-left:40px;display:grid;gap:10px} /* 로고 얼굴 폭만큼 들여 말풍선과 줄을 맞춘다 */
.chat-media figure{position:relative;margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--soft)}
.chat-media img{display:block;width:100%;height:auto;max-height:260px;object-fit:cover}
.chat-media figcaption{padding:6px 10px;font-size:13px;line-height:1.5;color:var(--muted)}
.chat-media-tag{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:999px;background:var(--orange);color:var(--bg);font-size:12px;font-weight:700}
.chat-media .is-video img{filter:brightness(.92)}
.bubble.user{align-self:flex-end;background:var(--mint-fill);color:var(--fg);border-radius:12px 12px 4px 12px}
.chat-chips[hidden]{display:none}
.chat-post{align-self:flex-start;margin-left:40px;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid var(--orange);border-radius:999px;color:var(--orange);font-weight:700;font-size:14px;text-decoration:none}
.chat-chips-toggle{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 14px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--orange);font:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer}
.chat-chips-toggle::after{content:"";width:8px;height:8px;margin-left:auto;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px)}
.chat-chips-toggle[aria-expanded="false"]::after{transform:rotate(-135deg) translate(-2px,-2px)}
.chat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;max-height:140px;overflow:auto}
.chat-chips button{min-height:44px;padding:0 12px;border:1.5px solid var(--orange);background:transparent;color:var(--orange);border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chat-form{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.chat-form input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
.chat-note{margin:0;padding:0 14px 10px;font-size:12px;color:var(--muted)}
body.has-chat .foot{padding-bottom:88px} /* 말풍선 버튼이 푸터 링크를 가리지 않게 */
@media (max-width:640px){
  .chat-fab{right:12px;bottom:12px}
  .chat-panel{right:8px;left:8px;bottom:72px;width:auto;max-height:calc(100vh - 96px)}
}

/* 첫 화면: 메인 사진 띠 + 가운데 한 줄 글 카드 + 전체 글 보기 (참고 레이아웃, 11-24. 쉬어가기는 같은 날 없앰) */
.feed{max-width:860px;padding-block:40px 72px}
.feed .sec-head h1{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0}
.all-posts{display:flex;justify-content:center;margin:36px 0 56px}
.all-posts .btn{min-width:220px}
/* 헤더 '내 계정' 메뉴 */
.acct-menu{position:relative;order:-1}
.acct-menu > summary{list-style:none}
.acct-menu > summary::-webkit-details-marker{display:none}
.acct-menu > summary::after{content:"▾";margin-left:6px;font-size:12px}
.acct-pop{position:absolute;right:0;top:calc(100% + 8px);width:300px;z-index:40;box-shadow:0 12px 32px rgba(0,0,0,.18)}
/* 첫 화면 */
/* 메인 사진 띠: 꾸밈 사진이라 alt 를 비우고 띠 전체를 aria-hidden 으로. 사이트 이름은 사진과 겹쳐 뺐다(사용자 결정) */
.banner{position:relative;height:clamp(180px,30vw,380px);overflow:hidden;background:var(--soft)}
.banner img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums;align-items:center}

/* 공통 화면 머리 */
.page{padding-block:40px 72px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:2px solid var(--fg)}
.page-head h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;line-height:1.2;margin:8px 0 0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:15px;min-height:44px}
.back:hover{color:var(--orange)}

/* 카테고리 */
.cats{display:flex;gap:8px;flex-wrap:wrap;padding-block:20px 4px}
.chip{font-size:15px;font-weight:500;min-height:40px;padding:0 16px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
.chip:hover{border-color:var(--orange);color:var(--orange)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-size:12px;margin-left:6px;opacity:.7}

/* 글 목록 */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:10px}
.sec-head h2{font-family:var(--f-display);font-weight:900;font-size:20px;margin:0}
.posts{list-style:none;margin:0;padding:0}
.post{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:0;margin-bottom:20px;border:1px solid var(--line);background:var(--bg);transition:box-shadow .2s,transform .2s}
.post:hover{box-shadow:0 10px 28px rgba(0,0,0,.10);transform:translateY(-2px)}
.post .thumb{position:relative;display:block;min-height:200px;background:var(--mint-fill);overflow:hidden} /* 컴퓨터: 카드 높이만큼 채운다 */
.post .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.post .thumb img.fit{object-fit:contain} /* 고정 글의 그림(정사각형에 가까움)은 잘리지 않게 통째로 */
.post .thumb .ch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:900;font-size:56px;color:var(--orange)}
.post .body{padding:22px 24px;display:flex;flex-direction:column;min-width:0}
.post .body .read{display:block;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.post .side{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:8px}
.post .cat{font-size:14px;font-weight:700;color:var(--orange)}
.post time{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:700;padding:1px 8px;white-space:nowrap;font-family:var(--f-body)}
.badge.notice{background:var(--red);color:var(--on-red)}
.badge.seed{background:transparent;color:var(--muted);border:1px dashed var(--line)} /* 예시 데이터 표시 */
.badge.private{background:var(--mint-fill);color:var(--on-mint)}
.badge.public{border:1.5px solid var(--fg)}
.badge.role-pending{background:var(--mint-fill);color:var(--on-mint)}
.badge.role-writer{background:var(--orange-fill);color:var(--on-orange)}
.badge.role-admin{background:var(--red);color:var(--on-red)}
.post h3{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.4;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.post h3 a{text-decoration:none;background:linear-gradient(var(--orange-fill),var(--orange-fill)) 0 100%/0 3px no-repeat;transition:background-size .25s}
.post h3 a:hover{background-size:100% 3px}
.post p{margin:0 0 10px;color:var(--muted);max-width:62ch}
.post .read{font-family:var(--f-mono);font-size:13px;color:var(--mint)}
.empty{padding:36px 0;color:var(--muted)}
.empty strong{color:var(--fg);display:block;font-size:19px;margin-bottom:4px}
.more{margin-top:32px;width:100%;min-height:52px;font-weight:700;background:transparent;color:var(--fg);border:2px solid var(--fg);cursor:pointer}
.more:hover{border-color:var(--orange);color:var(--orange)}

/* 사이드바 */
aside{display:flex;flex-direction:column;gap:40px}
aside h2{font-family:var(--f-display);font-weight:900;font-size:18px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--fg)}
.account{background:var(--orange-fill);color:var(--on-orange);padding:24px;display:flex;flex-direction:column;gap:14px}
.account h2{border-color:var(--on-orange);margin:0}
.account p{margin:0;font-size:15px;opacity:.85}
.account .who{font-family:var(--f-mono);font-size:14px;word-break:break-all}
.account .counts{display:flex;gap:16px;font-size:14px;font-variant-numeric:tabular-nums}
.account .btn.line{color:var(--on-orange);border-color:var(--on-orange)}
.account .btn.line:hover{background:var(--on-orange);color:var(--orange-fill);border-color:var(--on-orange)}
.account .btn.sub{background:var(--on-orange);color:var(--orange-fill)}
.account .btn.sub:hover{background:var(--red);color:var(--on-red)}
.account .row{display:flex;gap:8px;flex-wrap:wrap}

/* 글 상세 */
.article{max-width:760px}
.article h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,4.6vw,48px);line-height:1.25;letter-spacing:-.03em;margin:16px 0 18px;text-wrap:balance}
.article .meta{padding-bottom:20px;border-bottom:1px solid var(--line)}
.article-body{white-space:pre-wrap;margin:28px 0 0;font-size:18px;line-height:1.9;max-width:65ch}
.share{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:28px}.share .msg{margin:0}
.article-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px;align-items:center}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:48px;border-top:2px solid var(--fg)}
.pager a{display:flex;flex-direction:column;gap:2px;padding:18px 0;text-decoration:none;min-width:0}
.pager a:last-child{text-align:right;align-items:flex-end;border-left:1px solid var(--line);padding-left:16px}
.pager a:first-child{padding-right:16px}
.pager small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pager span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pager a:hover span{color:var(--orange)}

/* 양식 */
.form{max-width:760px;display:flex;flex-direction:column;gap:20px;padding-top:28px}
.form.narrow{max-width:440px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:15px;font-weight:700}
.field input,.field textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:2px solid var(--fg);padding:10px 12px;min-height:48px;width:100%}
.field textarea{min-height:320px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--orange)}
.hint{font-size:13px;color:var(--muted)}
fieldset.field{border:0;padding:0;margin:0}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vis label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);padding:12px;cursor:pointer;font-weight:400}
.vis label b{display:block}
.vis label span{font-size:13px;color:var(--muted)}
.vis input{width:20px;height:20px;min-height:0;margin:3px 0 0;accent-color:var(--fg);flex:none}
.vis label:has(input:checked){border-color:var(--fg);background:var(--soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.msg{font-size:14px;margin:0;min-height:1.4em}
.msg.err{color:var(--fg);font-weight:700;border-left:4px solid var(--danger);padding-left:10px}
.btn[data-armed="1"]{background:var(--danger);color:var(--on-danger);border-color:var(--danger)}
.switch{font-size:14px;color:var(--muted);margin:0}
.switch button{background:none;border:0;color:var(--orange);font-weight:700;cursor:pointer;text-decoration:underline;padding:4px}
/* 첫 화면 글 메뉴(11-25): 글씨만 있는 작은 카드 3개. 이름 오른쪽에 글 수 */
.menu-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px;max-width:860px} /* 아래 글 칸(.feed)과 같은 너비 */
.menu-card{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);text-decoration:none;font-weight:700;font-size:15px;transition:border-color .15s,background .15s}
.menu-card:hover,.menu-card:focus-visible{border-color:var(--orange);background:var(--mint-fill)}
.mc-name{color:var(--orange);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-n{flex:none;min-width:24px;padding:1px 8px;border-radius:999px;background:var(--mint-fill);color:var(--muted);font-family:var(--f-mono);font-size:12px;font-weight:500;text-align:center}
@media (max-width:640px){.menu-cards{gap:6px;margin-top:16px}.menu-card{padding:6px 10px;font-size:13px;min-height:44px;border-radius:14px}.mc-name{white-space:normal;line-height:1.25}.mc-n{padding:1px 6px;font-size:11px}} /* 휴대폰: 긴 이름(오늘의 프롬프트)은 두 줄로 */
.prompt-box{margin:20px 0 0;border:1px solid var(--line);border-left:4px solid var(--orange-fill);border-radius:10px;background:var(--soft);padding:12px 14px}
.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.prompt-head b{color:var(--orange)}
.prompt-box pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:15px;line-height:1.75;color:var(--fg)} /* 숫자 글꼴(Plex Mono)엔 한글이 없어 본문 글꼴로 */
.prompt-box .msg:empty{display:none}
.post-file{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:20px 0 0}
.post-file span{font-size:14px;color:var(--muted)}
.post-figure{margin:20px 0 0}
.post-figure img{display:block;max-width:100%;width:auto;height:auto;border:1px solid var(--line);border-radius:12px} /* 그림 크기 그대로, 칸보다 크면 칸에 맞춘다 */
.notice-box{max-width:560px;padding:24px;border:2px solid var(--fg);margin-top:28px;display:flex;flex-direction:column;gap:14px}
.notice-box p{margin:0}

/* 관리자 */
.members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-width:760px}
.members li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.members .email{display:block;font-weight:700;word-break:break-all}
.members .since{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.members .btn{min-height:40px;padding:0 14px;font-size:15px}
.stat{display:flex;gap:24px;flex-wrap:wrap;padding-block:20px;font-variant-numeric:tabular-nums}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:28px;line-height:1.2}
.stat span{font-size:14px;color:var(--muted)}

/* 푸터: 문양색 #2F3E63 바탕(다크 모드도 같음). 위에 강조색 띠. 강조색 테두리는 푸터 안에서 안 보여서 글자색으로 */
footer{background:var(--footer-bg);color:var(--on-footer);border-top:4px solid var(--red)}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;padding-block:32px;font-size:14px;color:var(--on-footer)}
/* 푸터 로고: 전구와 이름은 흰색, 톱니와 THINK & MAKE 는 금색(사용자 결정, 11-24) */
.foot-brand{display:flex;align-items:center;gap:12px}
.foot-brand img{display:block;height:48px;width:auto}
.foot-brand p{margin:0;display:flex;flex-direction:column;line-height:1.15}
.foot-name{font-family:var(--f-display);font-weight:900;font-size:22px;color:#FFFFFF;letter-spacing:-.01em}
.foot-info{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.foot a,footer .link-btn{color:var(--on-footer)}
.foot a:hover,footer .link-btn:hover{color:var(--footer-hover)}
footer :focus-visible{outline-color:var(--on-footer)}

@media (max-width:980px){
  .search{width:auto;flex:1}
  nav.main{display:none}
  nav.main.open{display:flex;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--bg);border-bottom:2px solid var(--fg);padding:8px max(16px,env(safe-area-inset-left,0px))}
  .nav-group{flex-direction:column}
  .nav-group .sub{display:flex;position:static;min-width:0;padding:0 0 0 16px;border:0;border-radius:0;box-shadow:none;background:transparent} /* 휴대폰: 글 목록 아래에 들여 써서 늘 보인다 */
  .menu-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:2px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;flex:none}
  .bar{gap:10px}
}
@media (max-width:640px){
  .foot-info{align-items:flex-start;text-align:left}
  body{font-size:16px}
  .post{grid-template-columns:1fr}
  .post .thumb{min-height:0;aspect-ratio:1200/630}
  .post .body{padding:16px 18px}
  .acct-pop{position:fixed;left:16px;right:16px;top:72px;width:auto}
  .logo .name{display:none}
  .auth .btn{padding:0 12px}
  .auth .out{display:none}
  .vis{grid-template-columns:1fr}
  .members li{grid-template-columns:minmax(0,1fr) auto}
  .members .btn{grid-column:1/-1}
  .article-body{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.badge.role-member{background:var(--mint-fill);color:var(--on-mint)}
.badge.role-warned{background:var(--orange-fill);color:var(--on-orange)}
.badge.role-banned{background:var(--danger);color:var(--on-danger)}
.m-acts{display:flex;gap:8px;flex-wrap:wrap}
nav.main a[hidden]{display:none}
.comments{margin-top:48px;padding-top:20px;border-top:2px solid var(--fg)}
.comments h2{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0 0 12px}
.comments h2 span{color:var(--orange)}
.c-list{list-style:none;margin:0;padding:0}
.comment{padding:16px 0;border-bottom:1px solid var(--line)}
.c-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--muted)}
.c-meta b{color:var(--fg)}
.c-meta time{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.c-body{white-space:pre-wrap;margin:6px 0 0}
.c-actions{display:flex;gap:4px;margin-top:4px}
.c-actions button{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;min-height:36px;padding:0 8px 0 0;text-decoration:underline}
.c-actions button:hover{color:var(--orange)}
.c-form{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.c-form textarea{font:inherit;font-size:16px;line-height:1.6;color:var(--fg);background:var(--bg);border:2px solid var(--fg);padding:10px 12px;min-height:110px;width:100%;resize:vertical}
.c-form textarea:focus{outline:none;border-color:var(--orange)}
.c-form .actions{align-items:center}
.c-label{font-weight:700;font-size:15px}
.c-login{margin-top:20px;padding:16px;background:var(--soft);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.c-login p{margin:0}
.foot-links{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.link-btn{background:none;border:0;padding:0;font:inherit;font-size:14px;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:44px}
.link-btn:hover{color:var(--orange)}
.c-replies{list-style:none;margin:10px 0 0 22px;padding:0 0 0 16px;border-left:3px solid var(--line)}
.c-replies .comment{padding:12px 0}
.c-replies .comment:last-child{border-bottom:0}
.c-rbadge{background:var(--soft);color:var(--fg)}
.comment.deleted > .c-body{color:var(--muted);font-style:italic}
.c-reply-form{margin:12px 0 0 22px}
@media (max-width:560px){.c-replies{margin-left:8px;padding-left:12px}.c-reply-form{margin-left:8px}}
.att-pick{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.att-pick li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);font-size:15px;min-width:0}
.att-pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-pick .sz{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none}
.att-pick button{flex:none;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:36px;font-size:14px}
.att-pick button:hover{color:var(--orange)}
.att-kind{flex:none;font-size:12px;font-weight:700;padding:1px 8px;background:var(--soft)}
.att-kind.pdf{background:var(--red);color:var(--on-red)}
.att-kind.img{background:var(--mint-fill);color:var(--on-mint)}
.att-kind.keep{background:transparent;border:1.5px solid var(--line)}
.file-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:2px dashed var(--fg);cursor:pointer;font-weight:700;width:fit-content}
.file-btn:hover{border-color:var(--orange);color:var(--orange)}
.file-btn:focus-within{outline:3px solid var(--orange);outline-offset:3px}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0}
.atts{margin-top:32px;padding-top:16px;border-top:1px solid var(--line)}
.atts h2{font-family:var(--f-display);font-weight:900;font-size:18px;margin:0 0 12px}
.att-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin-bottom:12px}
.att-imgs figure{margin:0;min-width:0}
.att-imgs img{display:block;width:100%;height:180px;object-fit:cover;border:1px solid var(--line);background:var(--soft)}
.att-imgs figcaption{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.att-files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.att-file{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--fg);text-decoration:none;min-width:0}
.att-file:hover{border-color:var(--orange)}
.att-file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.att-file .sz{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none}
.admin-tabs{display:flex;flex-wrap:wrap;gap:4px 24px;margin:16px 0 4px;border-bottom:1px solid var(--line)}
.admin-tabs a{padding:8px 0;text-decoration:none;color:var(--muted);min-height:40px;display:inline-flex;align-items:center;gap:6px}
.admin-tabs a[aria-current="page"]{color:var(--fg);font-weight:700;box-shadow:inset 0 -3px 0 var(--fg)}
.admin-tabs a:hover{color:var(--orange)}
.admin-tabs .n{font-family:var(--f-mono);font-size:12px}
.ac-list{list-style:none;margin:8px 0 0;padding:0;max-width:900px}
.ac-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.ac-item.hidden-c{opacity:.6}
.ac-post{font-weight:700;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.ac-post:hover{color:var(--orange)}
.ac-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:14px;color:var(--muted)}
.ac-meta b{color:var(--fg)}
.ac-meta time{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.ac-body{grid-column:1/-1;margin:2px 0 0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ac-acts{display:flex;gap:8px;align-items:flex-start;grid-row:1/3;grid-column:2}
.ac-acts .btn{min-height:40px;padding:0 14px;font-size:15px}
@media (max-width:560px){.ac-item{grid-template-columns:1fr}.ac-acts{grid-row:auto;grid-column:1}}
</style>
</head>
<body>

<a class="skip" href="#view">본문으로 바로가기</a>

<header class="site">
  <div class="wrap bar">
    <a class="logo" href="#" aria-label="생각하는 공방 첫 화면"><img class="logo-img" src="assets/logo.png" alt="" width="198" height="265"><span class="name"><span class="name-main">생각하는 공방</span><span class="tagline">THINK &amp; MAKE</span></span></a>
    <nav class="main" id="mainnav" aria-label="주 메뉴">
      <a href="#" data-nav="home">홈</a>
      <div class="nav-group">
        <a href="#list" data-nav="list">글 목록</a>
        <div class="sub" role="group" aria-label="글 목록 소메뉴">
          <a href="#m-plan" data-nav="m-plan">기획</a>
          <a href="#m-image" data-nav="m-image">이미지</a>
          <a href="#m-prompt" data-nav="m-prompt">오늘의 프롬프트</a>
        </div>
      </div>

      <span class="sr">글 검색</span>
      <input id="q" type="search" placeholder="글 검색" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </label>
    <div class="auth" id="authArea"></div>
    <button class="menu-btn" id="menuBtn" aria-controls="mainnav" aria-expanded="false" aria-label="메뉴 열기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>

<div class="demo-strip" id="demoStrip" hidden>
  <div class="wrap"><b>체험 모드</b>로그인, 글, 댓글이 이 브라우저에만 저장됩니다. 관리자는 관리자 로그인에서 비밀번호로 들어옵니다.</div>
</div>

<main id="view" tabindex="-1"></main>

<footer>
  <div class="wrap foot">
    <div class="foot-brand"><img src="assets/logo-footer.png" alt="" width="198" height="265"><p><span class="foot-name">생각하는 공방</span><span class="tagline">THINK &amp; MAKE</span></p></div>
    <div class="foot-info"><span>© 2026 생각하는 공방 · 모든 시간은 한국 시간(KST) 기준입니다</span>
    <span class="foot-links"><button type="button" class="link-btn" id="gaToggle" hidden></button><a href="#admin">관리자 로그인</a></span></div>
  </div>
</footer>

<!-- 포트폴리오 안내 챗봇(11-24). 답은 AI 가 자동 실행 때 미리 만든 ai/chatbot/qa.js 에서만 읽는다. 방문자가 물어도 AI 를 부르지 않는다 -->
<button type="button" class="chat-fab" id="chatFab" aria-controls="chatPanel" aria-expanded="false" hidden>
  <span class="fab-avatar" aria-hidden="true"><img src="assets/logo.png" alt="" width="198" height="265"></span><span>질문해주세요</span>
</button>
<section class="chat-panel" id="chatPanel" role="dialog" aria-labelledby="chatTitle" hidden>
  <div class="chat-head"><h2 id="chatTitle">생각하는 공방</h2><button type="button" class="chat-close" id="chatClose" aria-label="대화창 닫기">×</button></div>
  <div class="chat-log" id="chatLog" aria-live="polite"></div>
  <button type="button" class="chat-chips-toggle" id="chatChipsToggle" aria-controls="chatChips" aria-expanded="true">준비된 질문 접기</button>
  <div class="chat-chips" id="chatChips" role="group" aria-label="준비된 질문"></div>
  <form class="chat-form" id="chatForm"><label class="sr" for="chatQ">질문 적기</label><input id="chatQ" maxlength="100" autocomplete="off" placeholder="블로그에 관해 물어보세요"><button class="btn" type="submit">묻기</button></form>
  <p class="chat-note">AI 가 포트폴리오 자료로 미리 만든 답이에요. 틀릴 수 있어요.</p>
</section>

<script>
/* ===== 설정: Supabase 프로젝트 정보를 넣으면 실제 로그인, 글, 댓글 저장이 켜집니다 =====
   비워 두면 체험 모드로 동작합니다. */

/* ===== 설정: Google Analytics 4 측정 ID (G-로 시작). 비워 두면 GA 를 불러오지 않습니다 ===== */
const GA_MEASUREMENT_ID = "G-5HJBBKMVE3";


/* ===== 방문 통계 (GA4) =====
   규칙: 이메일, 댓글 내용, 비밀번호 같은 개인정보는 절대 보내지 않는다.
   이벤트 이름과 파라미터는 docs/ANALYTICS.md 의 택소노미를 따른다. */
const GA_OPTOUT_KEY = "samsaekpen-ga-optout";
const GA_INTERNAL_KEY = "samsaekpen-ga-internal";
const analytics = (() => {
  const buffer = window.samsaekpenEvents = [];   // 테스트와 디버그용 기록 (GA 를 꺼도 쌓임)
  let on = false, sent = {};
  const isInternal = () => { try { return localStorage.getItem(GA_INTERNAL_KEY) === "1"; } catch { return false; } };
  const optedOut = () => { try { return localStorage.getItem(GA_OPTOUT_KEY) === "1"; } catch { return false; } };
  const start = () => {
    if (!GA_MEASUREMENT_ID || optedOut()) return;
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ window.dataLayer.push(arguments); };
    window.gtag("js", new Date());
    window.gtag("config", GA_MEASUREMENT_ID, { send_page_view: false });
    const sc = document.createElement("script"); sc.async = true;
    sc.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(GA_MEASUREMENT_ID);
    document.head.appendChild(sc);
    on = true;
  };
  const clean = params => { const o = {}; for (const [k, v] of Object.entries(params || {})) if (v !== undefined && v !== null && v !== "") o[k] = typeof v === "string" ? v.slice(0, k === "page_location" ? 500 : 100) : v; return o; }; // 주소는 UTM 이 붙으면 길어서 500자까지
  const track = (name, params) => {
    const p = clean(params);
    buffer.push({ name, params: p, at: new Date().toISOString() });
    if (on && window.gtag) window.gtag("event", name, p);
  };
  const setUser = r => {
    const userRole = r || "guest";
    buffer.push({ name: "user_properties", params: { user_role: userRole } });
    // 검색·공유 페이지(p/글번호/)에서도 관리자 방문을 거를 수 있게 이 브라우저에 표시해 둔다. 로그아웃해도 같은 사람이므로 남긴다
    try { if (userRole === "admin") localStorage.setItem(GA_INTERNAL_KEY, "1"); else if (userRole !== "guest") localStorage.removeItem(GA_INTERNAL_KEY); } catch {}
    if (!on || !window.gtag) return;
    window.gtag("set", "user_properties", { user_role: userRole });
    window.gtag("set", { traffic_type: userRole === "admin" || isInternal() ? "internal" : undefined }); // 관리자 방문은 GA 에서 내부 트래픽으로 걸러냄
  };
  const once = key => { if (sent[key]) return false; sent[key] = true; return true; };
  const setOptOut = v => {
    try { v ? localStorage.setItem(GA_OPTOUT_KEY, "1") : localStorage.removeItem(GA_OPTOUT_KEY); } catch {}
    if (GA_MEASUREMENT_ID) window["ga-disable-" + GA_MEASUREMENT_ID] = !!v;
  };
  if (GA_MEASUREMENT_ID && optedOut()) window["ga-disable-" + GA_MEASUREMENT_ID] = true;
  return { start, track, setUser, once, optedOut, setOptOut, get enabled(){ return !!GA_MEASUREMENT_ID; } };
})();

async function checkFile(f, maxBytes){
  const ext = attExt(f.name), want = ATT_TYPES[ext];
  if (!want) return `${f.name}: JPG, PNG, GIF, PDF 파일만 올릴 수 있어요.`;
  if (f.type && f.type !== want && !(want === "image/jpeg" && f.type === "image/jpg")) return `${f.name}: 파일 이름과 실제 형식이 달라요.`;
  if (f.size > maxBytes) return `${f.name}: ${fmtSize(maxBytes)}보다 큰 파일은 올릴 수 없어요.`;
  if (!f.size) return `${f.name}: 빈 파일이에요.`;
  const head = new Uint8Array(await f.slice(0, 8).arrayBuffer());
  const sig = {"image/jpeg":[0xFF,0xD8,0xFF], "image/png":[0x89,0x50,0x4E,0x47], "image/gif":[0x47,0x49,0x46,0x38], "application/pdf":[0x25,0x50,0x44,0x46]}[want];
  if (!sig.every((b, i) => head[i] === b)) return `${f.name}: 파일 내용이 ${ext.toUpperCase()} 형식이 아니에요.`;
  return null;
}

const local = (() => {
  const KEY = "samsaekpen-demo-v3"; let mem = {user:null, posts:[], users:{}, comments:[]};
  // 예시 데이터는 버전마다 한 번만 넣는다. 관리자가 지우거나 경고한 결과는 그대로 남는다

    if (d.seeded === DEMO_SEED.v) return d;
    d = {...d, users:{...d.users}, comments:[...d.comments], seeded:DEMO_SEED.v};
    for (const x of DEMO_SEED.users) if (!Object.values(d.users).some(y => y.id === x.id)) d.users[x.email] = {...x};
    for (const x of DEMO_SEED.comments) if (!d.comments.some(y => y.id === x.id)) d.comments.push({...x});
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} mem = d;
    return d;
  };
  const load = () => { try { return withSeed({...mem, ...(JSON.parse(localStorage.getItem(KEY)) || {})}); } catch { return withSeed(mem); } };
  const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { if (e && /quota/i.test(e.name + e.message)) throw new Error("STORAGE_FULL"); } mem = d; };
  return { load, save };
})();

function parseRoute(){
  const h = location.hash.replace(/^#/, "");
  let m;
  if (!h) return {name:"home"};
  if (h === "list") return {name:"list"};
  if (h === "write") return {name:"write"};
  if (h === "login") return {name:"login"};
  if (h === "admin") return {name:"admin"};
  if (h === "admin-comments") return {name:"admin", tab:"comments"};
  if ((m = h.match(/^m-(\w+)$/)) && MENUS.some(x => x.key === m[1])) return {name:"list", menu:m[1]};
  if ((m = h.match(/^post-([\w-]+)$/))) return {name:"post", id:m[1]};
  if ((m = h.match(/^edit-([\w-]+)$/))) return {name:"edit", id:m[1]};
  return {name:"home"};
}
/* 주소 # 뒤를 GA 가 읽는 경로로 바꾼다. GA4 는 page_location(전체 주소)으로 페이지 경로를 정한다.
   글은 검색·공유 페이지와 같은 실제 주소(p/12/)로 보내, 어느 쪽으로 읽어도 GA 에서 한 줄로 모인다.
   나머지 화면은 사이트 주소 뒤에 붙는 가상 경로다. 예: #list → /thinkandmake/list */
function pageInfo(r){
  const map = { home:["", "home"], list:["list", "list"], write:["write", "write"], login:["login", "login"] };
  if (r.name === "list" && r.menu) return [`menu/${r.menu}`, "menu"];
  if (r.name === "post") return [`p/${r.id}/`, String(r.id).startsWith("notice") ? "notice" : "post"];
  if (r.name === "edit") return [`edit/${r.id}`, "edit"];
  if (r.name === "admin") return [r.tab === "comments" ? "admin/comments" : "admin", r.tab === "comments" ? "admin_comments" : "admin"];
  return map[r.name] || ["", "home"];
}
/* 검색어에 섞인 이메일, 전화번호 같은 긴 숫자는 GA 로 보내기 전에 가린다 */
const redactTerm = q => String(q).replace(/[^\s@]+@[^\s@]+/g, "[이메일]").replace(/\d[\d\s-]{5,}\d/g, "[숫자]");
const siteBase = () => new URL(".", location.href.split("#")[0].split("?")[0]).href; // 예: https://mopnt135.github.io/thinkandmake/
/* UTM 링크로 들어왔을 때 GA 가 출처를 알 수 있게, 주소의 utm_ 값만 page_location 에 붙인다. 다른 값은 보내지 않는다 */
const campaignQuery = () => {
  const keep = new URLSearchParams();
  for (const [k, v] of new URLSearchParams(location.search)) if (/^utm_(source|medium|campaign|content|term|id)$/.test(k)) keep.set(k, v.slice(0, 100));
  const q = keep.toString(); return q ? "?" + q : "";
};
let pendingPageView = false, readTimer = null, viewStartedAt = 0;
function trackPageView(){
  const r = parseRoute(), [rel, type] = pageInfo(r);
  const p = r.name === "post" ? findPost(r.id) : null;
  const url = siteBase() + rel + campaignQuery();
  analytics.track("page_view", {
    page_location: url, page_path: new URL(url).pathname, page_type: type, view_source: "app",
    page_title: p ? `${p.title} · 생각하는 공방` : document.title
  });
  clearTimeout(readTimer); viewStartedAt = Date.now();
  if (p) {
    analytics.track("post_view", { post_id: String(p.id), post_title: p.title, post_category: p.category, is_notice: !!p.notice, attachment_count: (p.attachments || []).length, view_source: "app" });
    readTimer = setTimeout(checkReadComplete, 10000);
  }
}
/* 글을 끝까지 읽음: 본문 끝이 화면에 보이고, 글을 연 지 10초가 지났을 때 한 번 */
function checkReadComplete(){
  const r = parseRoute(); if (r.name !== "post") return;
  const body = document.querySelector(".article-body"); if (!body) return;
  const seconds = Math.round((Date.now() - viewStartedAt) / 1000);
  if (seconds < 10 || body.getBoundingClientRect().bottom > innerHeight) return;
  const p = findPost(r.id); if (!p || !analytics.once("read:" + p.id + ":" + viewStartedAt)) return;
  analytics.track("post_read_complete", { post_id: String(p.id), post_title: p.title, post_category: p.category, engaged_seconds: seconds });
}

      <span class="read">읽는 시간 ${mins(p.body)}분${p.updated_at ? " · 수정됨" : ""}${(p.attachments || []).length ? ` · 첨부 ${p.attachments.length}개` : ""}</span>
    </div>
    </div>
  </li>`;
}

function accountCard(){
  if (!user) return `<section class="account"><h2>내 계정</h2><p>글은 누구나 읽을 수 있어요. 회원가입하고 로그인하면 바로 댓글을 달 수 있습니다.</p>
    <div class="row"><a class="btn sub" href="#login">로그인</a></div></section>`;
  const r = role || "member";
  const waiting = members.filter(m => m.role === "member" && (m.warns || 0) > 0).length;
  return `<section class="account"><h2>내 계정</h2>
    <p class="who">${esc(user.email)}</p>
    <div><span class="badge role-${r}">${ROLE_NAME[r] || "회원"}</span></div>
    <p>${r === "admin" ? "글쓰기, 댓글 관리, 회원 경고와 추방을 할 수 있어요." : r === "banned" ? "이용이 제한된 계정입니다. 댓글을 달 수 없어요." : "글을 읽고 댓글을 달 수 있어요."}</p>
    <div class="row">
      ${isAdmin() ? `<a class="btn" href="#write">글쓰기</a><a class="btn sub" href="#admin">회원 관리${waiting ? ` · 경고 ${waiting}명` : ""}</a>` : ""}

  if (adminMode && !REMOTE) return `<form class="form narrow" id="loginForm" novalidate>
    <div class="field"><label for="lPw">관리자 비밀번호</label><input id="lPw" type="password" autocomplete="current-password" required></div>
    <p class="msg" id="loginMsg" role="status"></p>
    <div class="actions"><button class="btn" type="submit" id="loginSubmit">관리자 로그인</button></div>
    <p class="switch">회원 로그인은 <a class="link2" href="#login">여기</a>에서 하세요.</p>
  </form>`;
  return `<form class="form narrow" id="loginForm" novalidate>
    <div class="field"><label for="lEmail">이메일</label><input id="lEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="lPw">비밀번호</label><input id="lPw" type="password" autocomplete="${signup ? "new-password" : "current-password"}" minlength="6" required><span class="hint">6자 이상</span></div>
    <p class="msg" id="loginMsg" role="status"></p>
    <div class="actions"><button class="btn" type="submit" id="loginSubmit">${signup ? "가입하기" : adminMode ? "관리자 로그인" : "로그인"}</button></div>
    ${adminMode ? `<p class="switch">관리자 계정은 Supabase에서 지정합니다. 일반 로그인은 <a class="link2" href="#login">여기</a>에서 하세요.</p>`
      : signup ? `<p class="switch">이미 계정이 있나요?<button type="button" data-act="toggleSignup">로그인</button></p>`
      : `<p class="switch">처음이신가요?<button type="button" data-act="toggleSignup">회원가입</button> 가입하면 바로 댓글을 달 수 있어요.</p>`}

const head = (title, label, extra = "") => `<div class="page-head"><div>${label ? `<div class="label">${label}</div>` : ""}<h1 tabindex="-1">${title}</h1></div>${extra}</div>`;

function attachmentsBlock(p){
  const atts = p.attachments || [];
  if (!atts.length) return "";
  const missing = atts.some(a => !attUrls[a.path]);
  if (missing) return `<section class="atts" aria-label="첨부 파일"><h2>첨부 파일 ${atts.length}</h2><p class="empty">${attLoading ? "첨부 파일을 불러오는 중입니다." : "첨부 파일을 열 수 없어요. 새로고침해 주세요."}</p></section>`;
  const imgs = atts.filter(isImage), files = atts.filter(a => !isImage(a));
  return `<section class="atts" aria-label="첨부 파일"><h2>첨부 파일 ${atts.length}</h2>
    ${imgs.length ? `<div class="att-imgs">${imgs.map(a => `<figure><a href="${esc(attUrls[a.path])}" target="_blank" rel="noopener"><img src="${esc(attUrls[a.path])}" alt="${esc(a.name)}" loading="lazy"></a><figcaption>${esc(a.name)} · ${fmtSize(a.size)}</figcaption></figure>`).join("")}</div>` : ""}
    ${files.length ? `<ul class="att-files">${files.map(a => `<li><a class="att-file" href="${esc(attUrls[a.path])}" target="_blank" rel="noopener"><span class="att-kind pdf">PDF</span><span class="nm">${esc(a.name)}</span><span class="sz">${fmtSize(a.size)}</span></a></li>`).join("")}</ul>` : ""}
  </section>`;
}

function commentsBlock(p){
  const list = commentsFor === String(p.id) ? comments : [];
  const ids = new Set(list.map(c => String(c.id)));
  const tops = list.filter(c => !c.parent_id || !ids.has(String(c.parent_id)));
  const repliesOf = id => list.filter(c => String(c.parent_id) === String(id));
  const orphanParents = new Set(list.filter(c => c.parent_id && !ids.has(String(c.parent_id))).map(c => String(c.parent_id)));
  const one = (c, isReply) => {
    const mine = user && c.author_id === user.id;
    const editing = editingComment === String(c.id);
    const replies = isReply ? [] : repliesOf(c.id);
    if (c.deleted) return `<li class="comment deleted"><p class="c-body">${esc(c.body || "삭제된 댓글입니다")}</p>${replies.length ? `<ul class="c-replies">${replies.map(r => one(r, true)).join("")}</ul>` : ""}</li>`;
    const canDelete = mine ? (canComment() || !replies.length) : isAdmin();
    return `<li class="comment${isReply ? " reply" : ""}">
      <div class="c-meta">${isReply ? '<span class="badge c-rbadge">답글</span>' : ""}<b>${esc(c.author_name || "회원")}</b>${c.seed ? '<span class="badge seed">예시</span>' : ""}${mine ? '<span class="badge role-member">내 댓글</span>' : ""}<time>${fmtTime(c.created_at)}</time>${c.updated_at ? "<span>수정됨</span>" : ""}</div>
      ${editing
        ? `<form class="c-form" data-edit-comment="${esc(c.id)}"><label class="sr" for="ce-${esc(c.id)}">댓글 고치기</label><textarea id="ce-${esc(c.id)}" maxlength="1000">${esc(c.body)}</textarea>
           <div class="actions"><button class="btn sub" type="submit">저장</button><button class="btn line" type="button" data-act="cancelEdit">취소</button></div></form>`
        : `<p class="c-body">${esc(c.body)}</p>
           <div class="c-actions">${!isReply && canComment() ? `<button type="button" data-act="replyComment" data-id="${esc(c.id)}">답글${replies.length ? ` ${replies.length}` : ""}</button>` : ""}${mine && canComment() ? `<button type="button" data-act="editComment" data-id="${esc(c.id)}">수정</button>` : ""}${canDelete ? `<button type="button" data-act="delComment" data-id="${esc(c.id)}" data-soft="${replies.length ? 1 : 0}">${mine ? "삭제" : "관리자 삭제"}</button>` : ""}</div>`}
      ${!isReply && replyTo === String(c.id) && canComment() ? `<form class="c-form c-reply-form" id="replyForm" data-post="${esc(p.id)}" data-parent="${esc(c.id)}" novalidate>
          <label for="rBody" class="c-label">${esc(c.author_name || "회원")}님에게 답글</label>
          <textarea id="rBody" maxlength="1000" placeholder="운영 기준을 지켜 답글을 남겨 주세요."></textarea>
          <div class="actions"><button class="btn sub" type="submit" id="rSubmit">답글 등록</button><button class="btn line" type="button" data-act="cancelReply">취소</button></div>
          <p class="msg" id="rMsg" role="status"></p></form>` : ""}
      ${replies.length ? `<ul class="c-replies" aria-label="답글">${replies.map(r => one(r, true)).join("")}</ul>` : ""}
    </li>`;
  };
  const items = [...orphanParents].map(pid => `<li class="comment deleted"><p class="c-body">보이지 않는 댓글입니다</p><ul class="c-replies">${repliesOf(pid).map(r => one(r, true)).join("")}</ul></li>`).join("")
    + tops.filter(c => !(c.parent_id && !ids.has(String(c.parent_id)))).map(c => one(c, false)).join("");
  const visible = list.filter(c => !c.deleted).length;
  let form;
  if (!user) form = `<div class="c-login"><p>댓글과 답글은 로그인한 회원만 달 수 있어요.</p><a class="btn sub" href="#login">로그인하고 댓글 달기</a></div>`;
  else if (isBanned()) form = `<div class="c-login"><p>이용이 제한된 계정이라 댓글을 달 수 없어요.</p></div>`;
  else form = `<form class="c-form" id="commentForm" data-post="${esc(p.id)}" novalidate>
      <label for="cBody" class="c-label">댓글 쓰기</label>
      <textarea id="cBody" maxlength="1000" placeholder="운영 기준을 지켜 댓글을 남겨 주세요."></textarea>
      <div class="actions"><button class="btn" type="submit" id="cSubmit">댓글 등록</button><span class="hint">1000자까지</span></div>
      <p class="msg" id="cMsg" role="status"></p>
    </form>`;
  return `<section class="comments" aria-label="댓글">
    <h2>댓글 <span>${commentsLoading ? "" : visible}</span></h2>
    ${commentsLoading ? `<p class="empty">댓글을 불러오는 중입니다.</p>` : list.length ? `<ul class="c-list">${items}</ul>` : `<p class="empty">아직 댓글이 없습니다.</p>`}
    ${form}
  </section>`;
}

function adminCommentsView(tabs){
  const roleOf = {}; members.forEach(m => { roleOf[m.id] = m; });
  const todayKST = fmt(new Date().toISOString());
  const isHidden = c => roleOf[c.author_id]?.role === "banned";
  const isToday = c => fmt(c.created_at) === todayKST;
  const list = adminComments.filter(c => acFilter === "all" || (acFilter === "today" ? isToday(c) : isHidden(c)));
  const chips = [["all", "전체", adminComments.length], ["today", "오늘", adminComments.filter(isToday).length], ["hidden", "숨겨진 댓글", adminComments.filter(isHidden).length]]
    .map(([k, label, n]) => `<button class="chip" data-acf="${k}" aria-pressed="${acFilter === k}">${label}<span class="n">${n}</span></button>`).join("");
  const items = list.slice(0, acShown).map(c => {
    const p = findPost(c.post_id), m = roleOf[c.author_id], hidden = isHidden(c);
    const w = m && m.role === "member" ? (m.warns || 0) : 0;
    return `<li class="ac-item${hidden ? " hidden-c" : ""}">
      <div style="min-width:0">${p ? `<a class="ac-post" href="#post-${esc(p.id)}">${esc(p.title)}</a>` : `<span class="ac-post">지워진 글</span>`}
        <div class="ac-meta">${c.parent_id ? '<span class="badge c-rbadge">답글</span>' : ""}${c.deleted ? '<span class="badge">삭제됨</span>' : ""}<b>${esc(c.author_name || "회원")}</b>${c.seed ? '<span class="badge seed">예시</span>' : ""}<span>${esc(m?.email || "")}</span><time>${fmtTime(c.created_at)}</time>${c.updated_at ? "<span>수정됨</span>" : ""}
          ${hidden ? '<span class="badge role-banned">추방 회원 · 숨겨짐</span>' : w > 0 ? `<span class="badge role-warned">경고 ${w}/${MAX_WARNS}</span>` : ""}</div></div>
      <div class="ac-acts">${p ? `<a class="btn line" href="#post-${esc(p.id)}">글에서 보기</a>` : ""}${c.deleted ? "" : `<button class="btn line" data-act="adminDelComment" data-id="${esc(c.id)}" data-soft="${adminComments.some(x => String(x.parent_id) === String(c.id) && !x.deleted) ? 1 : 0}">삭제</button>`}</div>
      <p class="ac-body">${esc(c.body)}</p>
    </li>`;
  }).join("");
  const authors = new Set(adminComments.map(c => c.author_id)).size, replyCount = adminComments.filter(c => c.parent_id && !c.deleted).length;
  return `<div class="wrap page">${head("댓글 현황", "관리자")}${tabs}
    <div class="stat"><div><b>${adminComments.length}</b><span>전체 댓글</span></div><div><b>${adminComments.filter(isToday).length}</b><span>오늘 (KST)</span></div><div><b>${adminComments.filter(isHidden).length}</b><span>숨겨진 댓글</span></div><div><b>${replyCount}</b><span>답글</span></div><div><b>${authors}</b><span>댓글 단 사람</span></div></div>
    <div class="cats" role="group" aria-label="댓글 거르기">${chips}</div>
    ${loading ? `<p class="empty">댓글을 불러오는 중입니다.</p>` : list.length ? `<ul class="ac-list">${items}</ul>` : `<p class="empty"><strong>${acFilter === "all" ? "아직 댓글이 없습니다." : "조건에 맞는 댓글이 없습니다."}</strong>${acFilter === "hidden" ? "추방된 회원의 댓글이 여기에 모입니다." : ""}</p>`}
    ${list.length > acShown ? `<button class="more" data-act="acMore">댓글 더 보기 (${list.length - acShown}개 남음)</button>` : ""}
    <p class="msg" id="acMsg" role="status"></p></div>`;
}

/* ===== 화면 ===== */
const views = {
  home(){
    const recent = allPosts().slice(0, 5);
    return `

    <nav class="wrap menu-cards" aria-label="글 메뉴">${MENUS.map(m => {
      const inCat = allPosts().filter(p => p.category === m.cat);

    }).join("")}</nav>
    <div class="wrap feed">
      <section class="main-col" aria-labelledby="recentTitle">
        <div class="sec-head"><h1 id="recentTitle" tabindex="-1">최근 글</h1></div>

          : loadError ? `<p class="empty"><strong>글을 불러오지 못했습니다.</strong>잠시 뒤 새로고침해 주세요.</p>`
          : `<ul class="posts">${recent.map(postItem).join("")}</ul>${posts.length ? "" : `<p class="empty">${isAdmin() ? "<strong>아직 올라온 글이 없습니다.</strong>글쓰기에서 첫 글을 올려 보세요." : "<strong>아직 올라온 글이 없습니다.</strong>지금은 공지와 소개 글만 있어요."}</p>`}`}
      </section>
      <div class="all-posts"><a class="btn" href="#list">전체 글 보기</a></div>
    </div>`;
  },

  list(r = {}){
    const all = allPosts();
    const menu = MENUS.find(m => m.key === r.menu);
    if (menu) cat = menu.cat;
    // 분류 버튼: 글 메뉴 셋은 글이 없어도 늘 보이고, 파일에 있는 글(자기소개, 이미지)의 분류도 넣는다
    const names = ["전체", "공지", ...new Set([...MENUS.map(m => m.cat), ...all.filter(p => !p.notice).map(p => p.category)])];
    if (posts.some(p => p.visibility === "private")) names.push("나만보기");
    if (!names.includes(cat)) cat = "전체";
    const list = all.filter(p =>
      (cat==="전체" || (cat==="나만보기" ? p.visibility==="private" : p.category===cat)) &&
      (!q || (p.title + " " + p.body).toLowerCase().includes(q)));
    const chips = names.map(c => {
      const n = c==="전체" ? all.length : c==="나만보기" ? posts.filter(p=>p.visibility==="private").length : all.filter(p=>p.category===c).length;
      return `<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}<span class="n">${n}</span></button>`;
    }).join("");
    let empty = "";
    if (loading) empty = "글을 불러오는 중입니다.";
    else if (loadError) empty = "<strong>글을 불러오지 못했습니다.</strong>잠시 뒤 새로고침해 주세요.";
    else if (!list.length) empty = q ? `<strong>‘${esc(q)}’ 검색 결과가 없습니다.</strong>다른 단어로 찾아보세요.` : `<strong>이 카테고리에는 아직 글이 없습니다.</strong>${menu ? "글이 올라오면 여기에 모입니다." : ""}`;
    return `<div class="wrap page">
      ${head(menu ? menu.cat : "글 목록", q ? `검색: ${esc(q)}` : menu ? "글 메뉴" : "전체 글", isAdmin() ? `<a class="btn" href="#write">글쓰기</a>` : "")}
      <div class="cats" role="group" aria-label="카테고리 선택">${chips}</div>
      <ul class="posts">${list.slice(0, shown).map(postItem).join("")}</ul>
      ${empty ? `<div class="empty">${empty}</div>` : ""}
      ${list.length > shown ? `<button class="more" data-act="more">글 더 보기 (${list.length - shown}편 남음)</button>` : ""}
    </div>`;
  },

  post(r){

    if (!p) return `<div class="wrap page">${head("글을 찾을 수 없습니다", "글 상세")}
      <div class="notice-box"><p>지워진 글이거나 아직 공개되지 않은 글일 수 있어요.</p>
      <div class="actions"><a class="btn sub" href="#list">글 목록으로</a></div></div></div>`;
    const all = allPosts(), i = all.indexOf(p), newer = all[i-1], older = all[i+1];
    return `<div class="wrap page"><article class="article">
      <a class="back" href="#list">← 글 목록</a>
      <h1 tabindex="-1">${esc(p.title)}</h1>
      <div class="meta">
        ${p.notice ? '<span class="badge notice">공지</span>' : `<span>${esc(p.category)}</span>`}
        <span>${fmt(p.created_at)} (KST)</span>
        ${p.updated_at ? `<span>수정 ${fmt(p.updated_at)}</span>` : ""}
        ${p.visibility==="private" ? '<span class="badge private">나만보기</span>' : '<span class="badge public">공개</span>'}
        <span>읽는 시간 ${mins(p.body)}분</span>
      </div>
      ${p.image ? `<figure class="post-figure"><img src="${esc(p.image)}" alt="${esc(p.imageAlt || "")}"></figure>` : ""}
      <p class="article-body">${esc(p.body)}</p>
      ${p.prompt ? `<section class="prompt-box" aria-label="프롬프트"><div class="prompt-head"><b>프롬프트</b><button type="button" class="btn line" data-act="copyPrompt" data-id="${esc(p.id)}">프롬프트 복사</button></div><pre>${esc(p.prompt)}</pre><p class="msg" id="promptMsg" role="status"></p></section>` : ""}
      ${p.file && FILE_PATH.test(p.file) ? `<div class="post-file"><a class="btn" href="${esc(p.file)}" download="${esc(p.fileName || "")}">PDF 내려받기</a><span>${esc(p.fileInfo || "")}</span></div>` : ""}
      ${attachmentsBlock(p)}
      ${p.visibility !== "private" ? `<div class="share"><button type="button" class="btn line" data-act="copyShare" data-id="${esc(p.id)}">공유 링크 복사</button>
        <p class="msg" id="shareMsg" role="status"></p></div>` : ""}
      ${isAdmin() && !p.notice && !p.fixed ? `<div class="article-actions">
        <a class="btn sub" href="#edit-${esc(p.id)}">수정</a>
        <button class="btn line" data-act="delete" data-id="${esc(p.id)}">삭제</button>
        <p class="msg" id="postMsg" role="status"></p></div>` : ""}
      ${commentsBlock(p)}
      <nav class="pager" aria-label="다른 글">
        ${newer ? `<a href="#post-${esc(newer.id)}"><small>← 다음 글</small><span>${esc(newer.title)}</span></a>` : "<span></span>"}
        ${older ? `<a href="#post-${esc(older.id)}"><small>이전 글 →</small><span>${esc(older.title)}</span></a>` : "<span></span>"}
      </nav>
    </article></div>`;
  },

  write(r){

          <span class="hint">목록에서 고르거나 새로 입력하세요.</span></div>

          <label><input type="radio" name="vis" id="visPrivate" value="private" ${v.visibility==="private"?"checked":""}><span><b>나만보기</b>관리자만 볼 수 있어요. 초안으로 쓰세요</span></label>
        </div></fieldset>
        <div class="field"><label for="wSummary">검색 설명 <small>(선택)</small></label><input id="wSummary" maxlength="${SUMMARY_MAX}" value="${esc(v.summary || "")}" aria-describedby="wSummaryHint">
          <span class="hint" id="wSummaryHint">검색 결과와 카카오톡 공유 미리보기에 나오는 한두 문장이에요. ${SUMMARY_MAX}자까지. 비워 두면 본문 앞부분을 씁니다.</span></div>
        <div class="field"><label for="wBody">내용</label><textarea id="wBody" required>${esc(v.body)}</textarea></div>
        <div class="field"><span class="c-label" id="wFilesLabel">첨부 파일</span>
          <label class="file-btn" for="wFiles"><input id="wFiles" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.pdf,image/jpeg,image/png,image/gif,application/pdf" aria-describedby="wFilesHint">파일 고르기</label>
          <span class="hint" id="wFilesHint">JPG, PNG, GIF, PDF만 · 파일당 ${fmtSize(store.attMax)}까지 · 한 글에 ${ATT_MAX_COUNT}개까지</span>
          <ul class="att-pick" id="attPick" aria-labelledby="wFilesLabel"></ul></div>

      </form></div>`;
  },

  login(){
    if (user) return `<div class="wrap page">${head("이미 로그인했어요", "로그인")}
      <div class="notice-box"><p class="who">${esc(user.email)}</p><div class="actions"><a class="btn sub" href="#">첫 화면으로</a><button class="btn line" data-act="logout">로그아웃</button></div></div></div>`;
    return `<div class="wrap page">${head(signupMode ? "회원가입" : "로그인", "계정")}${loginForm(false)}</div>`;
  },

  admin(r){
    if (!user) { afterLogin = "#admin"; return `<div class="wrap page">${head("관리자 로그인", "관리자")}${loginForm(true)}</div>`; }

    if (r.tab === "comments") return adminCommentsView(tabs);
    const others = members.filter(m => m.role !== "admin");
    const cnt = f => others.filter(f).length;
    const byAuthor = {}; adminComments.forEach(c => { byAuthor[c.author_id] = (byAuthor[c.author_id] || 0) + 1; });
    return `<div class="wrap page">${head("회원 관리", "관리자")}${tabs}
      <div class="stat"><div><b>${cnt(m => m.role === "member" && !(m.warns > 0))}</b><span>회원</span></div><div><b>${cnt(m => m.role === "member" && m.warns > 0)}</b><span>경고 받음</span></div><div><b>${cnt(m => m.role === "banned")}</b><span>추방</span></div></div>
      <p class="hint" style="margin:0 0 8px">가입한 사람은 바로 회원이 되어 댓글을 달 수 있습니다. 경고가 ${MAX_WARNS}회 쌓이면 자동으로 추방되고, 추방된 회원의 댓글은 다른 방문자에게 보이지 않습니다.</p>
      <ul class="members">${others.length ? others.map(m => {
        const w = m.warns || 0, last = m.role === "member" && w === MAX_WARNS - 1;
        const look = m.role === "banned" ? "banned" : w > 0 ? "warned" : "member";
        const name = m.role === "banned" ? "추방" : w > 0 ? "경고 받음" : "회원";
        return `<li><div><span class="email">${esc(m.email || "(이메일 없음)")}${m.seed ? ' <span class="badge seed">예시</span>' : ""}</span><span class="since">가입 ${fmt(m.created_at)} · 경고 ${m.role === "banned" ? "-" : `${w}/${MAX_WARNS}`} · 댓글 ${byAuthor[m.id] || 0}개</span></div>
          <span class="badge role-${look}">${name}</span>
          ${m.role === "banned"
            ? `<button class="btn line" data-member="unban" data-uid="${esc(m.id)}">추방 되돌림</button>`
            : `<span class="m-acts"><button class="btn sub" data-member="warn" data-uid="${esc(m.id)}" data-w="${w}">${last ? "경고 (자동 추방)" : "경고"}</button><button class="btn line" data-member="ban" data-uid="${esc(m.id)}">추방</button></span>`}
        </li>`; }).join("") : `<li><span>가입한 회원이 아직 없습니다.</span></li>`}</ul>
      <p class="msg" id="adminMsg" role="status"></p></div>`;
  }
};

/* ===== 그리기 ===== */
function renderHeader(r){
  $("authArea").innerHTML = !user
    ? `<a class="btn line" href="#login">로그인</a>`
    : `<button class="btn line out" data-act="logout">로그아웃</button>`  /* 화면에서는 '내 계정' 오른쪽. 휴대폰에서는 숨기고 '내 계정' 안의 로그아웃을 쓴다 */
      + `<details class="acct-menu"><summary class="btn line">내 계정</summary><div class="acct-pop">${accountCard()}</div></details>`;
  const w = document.querySelector('[data-nav="write"]'); if (w) w.hidden = !isAdmin();
  const navName = r.menu ? `m-${r.menu}` : r.name === "post" ? "list" : r.name === "edit" ? "write" : r.name === "login" ? "" : r.name;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === navName ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
}
function render(){
  const r = parseRoute();
  renderHeader(r);
  if (r.name === "post" && commentsFor !== String(r.id) && !commentsLoading) loadComments(r.id);
  if (r.name === "post") { const p = findPost(r.id); if (p && (p.attachments || []).some(a => !attUrls[a.path]) && !attLoading) loadAttUrls(p.attachments); }
  if ((r.name === "write" || r.name === "edit") && !loading && attFor !== (r.id || "new")) {
    const p = r.name === "edit" ? posts.find(x => String(x.id) === String(r.id)) : null;
    keptAtts = p ? [...(p.attachments || [])] : []; pendingFiles = []; removedAtts = []; attFor = r.id || "new";
  }
  const html = (r.name === "edit" ? views.write : views[r.name])(r);
  const keepText = ["cBody", "rBody"].map(id => [id, $(id) ? $(id).value : null]);
  $("view").innerHTML = html;
  keepText.forEach(([id, v]) => { if (v && $(id)) $(id).value = v; });
  if ($("attPick")) renderPick();
  const titles = {home:"생각하는 공방", list:"글 목록 · 생각하는 공방", write:"글쓰기 · 생각하는 공방", login:"로그인 · 생각하는 공방", admin:"관리자 · 생각하는 공방", edit:"글 수정 · 생각하는 공방"};
  document.title = r.name === "post" ? `${findPost(r.id)?.title || "글"} · 생각하는 공방` : titles[r.name];
  const md = document.querySelector('meta[name="description"]');
  if (md) { if (!md.dataset.site) md.dataset.site = md.content; const fp = r.name === "post" ? findPost(r.id) : null; md.content = fp ? postDesc(fp) : md.dataset.site; }
}
async function loadAttUrls(atts){
  attLoading = true;
  try { Object.assign(attUrls, await store.fileUrls(atts)); } catch (err) { console.error(err); }
  attLoading = false;
  if (parseRoute().name === "post") render();
}
function renderPick(){
  const kept = keptAtts.map(a => `<li><span class="att-kind keep">올린 파일</span><span class="nm">${esc(a.name)}</span><span class="sz">${fmtSize(a.size)}</span><button type="button" data-act="rmKept" data-path="${esc(a.path)}">빼기</button></li>`);
  const fresh = pendingFiles.map((f, i) => `<li><span class="att-kind ${attExt(f.name) === "pdf" ? "pdf" : "img"}">${attExt(f.name) === "pdf" ? "PDF" : "이미지"}</span><span class="nm">${esc(f.name)}</span><span class="sz">${fmtSize(f.size)}</span><button type="button" data-act="rmPending" data-i="${i}">빼기</button></li>`);
  $("attPick").innerHTML = kept.concat(fresh).join("");
}
async function loadComments(postId){
  commentsLoading = true; commentsFor = String(postId); comments = [];
  try { comments = await store.comments(postId); } catch (err) { console.error(err); comments = []; }
  commentsLoading = false;
  if (parseRoute().name === "post") render();
}
function show(){
  editingComment = null; attFor = null; replyTo = null;
  if (parseRoute().name === "admin" && isAdmin()) store.allComments().then(list => { adminComments = list; if (parseRoute().name === "admin") render(); }).catch(err => console.error(err));
  render();
  $("mainnav").classList.remove("open");
  if (!firstRender) { window.scrollTo(0, 0); const h = $("view").querySelector("h1"); if (h) h.focus({preventScroll:true}); }
  firstRender = false;
  if (loading) pendingPageView = true; else trackPageView();
}
async function refresh(){
  loading = true; commentsFor = null; render();
  try { role = user ? await store.role(user) : null; } catch (err) { console.error(err); role = "member"; }
  try { members = isAdmin() ? await store.members() : []; } catch (err) { console.error(err); members = []; }
  try { adminComments = isAdmin() ? await store.allComments() : []; } catch (err) { console.error(err); adminComments = []; }
  try { posts = await store.list(); loadError = false; } catch (err) { console.error(err); posts = []; loadError = true; }
  loading = false; render();
  analytics.setUser(user ? role : "guest");
  if (pendingPageView) { pendingPageView = false; trackPageView(); }
}

function alertBox(text){ const v = $("view"); if (!v) return; const d = document.createElement("p"); d.className = "msg err wrap"; d.setAttribute("role", "alert"); d.textContent = text; v.prepend(d); }
function msg(id, text, err){ const el = $(id); if (!el) return; el.textContent = text; el.className = "msg" + (err ? " err" : ""); }
function authError(e){
  const m = (e && e.message || "").toLowerCase();
  if (m.includes("invalid login")) return "이메일 또는 비밀번호가 맞지 않습니다.";
  if (m.includes("email not confirmed")) return "메일함에서 인증 링크를 먼저 눌러 주세요.";
  if (m.includes("already registered")) return "이미 가입된 이메일입니다. 로그인해 주세요.";
  if (m.includes("signups not allowed")) return "지금은 회원가입을 받지 않습니다.";
  return "처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.";
}

/* ===== 이벤트 ===== */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const act = t.dataset.act;
  if (act === "logout") { analytics.track("logout", { user_role: role || "member" }); await store.signOut(); user = null; role = null; members = []; await refresh(); return go(t.dataset.next || "#"); }
  if (act === "toggleSignup") { signupMode = !signupMode; return render(); }
  if (act === "more") { shown += 10; return render(); }
  if (t.dataset.acf) { acFilter = t.dataset.acf; acShown = 30; return render(); }
  if (t.classList.contains("chip")) { cat = t.dataset.c; shown = 10; analytics.track("category_filter", { category: cat }); return parseRoute().menu ? go("#list") : render(); }
  if (act === "acMore") { acShown += 30; return render(); }
  if (act === "adminDelComment") {
    if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "한 번 더 누르면 삭제"; return; }
    t.disabled = true;
    try { await store.removeComment(idOf(t.dataset.id), t.dataset.soft === "1"); analytics.track("comment_delete", { deleted_by: "admin", screen: "admin_comments", soft_delete: t.dataset.soft === "1" }); adminComments = await store.allComments(); commentsFor = null; render(); msg("acMsg", "댓글을 지웠습니다."); }
    catch (err) { console.error(err); t.disabled = false; t.textContent = "삭제하지 못했어요"; }
    return;
  }
  if (act === "rmPending") { pendingFiles.splice(Number(t.dataset.i), 1); return renderPick(); }
  if (act === "rmKept") { removedAtts.push(t.dataset.path); keptAtts = keptAtts.filter(a => a.path !== t.dataset.path); return renderPick(); }
  if (act === "replyComment") { replyTo = replyTo === t.dataset.id ? null : t.dataset.id; editingComment = null; render(); const r = $("rBody"); if (r) r.focus(); return; }
  if (act === "copyPrompt") {
    const p = findPost(t.dataset.id); if (!p || !p.prompt) return;
    try { await navigator.clipboard.writeText(p.prompt); msg("promptMsg", "프롬프트를 복사했어요. AI 채팅 창에 붙여 넣고 [여기에 프로젝트 이름] 을 바꿔 쓰세요."); }
    catch { msg("promptMsg", "복사하지 못했어요. 위 상자의 글을 길게 눌러 직접 복사해 주세요.", true); }
    return;
  }
  if (act === "copyShare") {
    const url = shareUrl(t.dataset.id);
    analytics.track("share_link_copy", { post_id: String(t.dataset.id) });
    try { await navigator.clipboard.writeText(url); msg("shareMsg", "링크를 복사했어요. 새 글은 미리보기가 생기기까지 최대 하루 걸릴 수 있어요."); }
    catch { msg("shareMsg", `복사하지 못했어요. 이 주소를 직접 복사해 주세요: ${url}`, true); }
    return;
  }
  if (act === "cancelReply") { replyTo = null; return render(); }
  if (act === "editComment") { editingComment = t.dataset.id; replyTo = null; return render(); }
  if (act === "cancelEdit") { editingComment = null; return render(); }
  if (act === "delComment" || act === "delete") {
    if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "한 번 더 누르면 삭제"; return; }
    t.disabled = true;
    try {
      if (act === "delete") { await store.remove(idOf(t.dataset.id)); analytics.track("post_delete", { post_id: String(t.dataset.id) }); await refresh(); go("#list"); }
      else { const c = comments.find(x => String(x.id) === t.dataset.id); await store.removeComment(idOf(t.dataset.id), t.dataset.soft === "1"); analytics.track("comment_delete", { post_id: commentsFor, deleted_by: c && user && c.author_id === user.id ? "self" : "admin", screen: "post", soft_delete: t.dataset.soft === "1" }); const pid = commentsFor; commentsFor = null; await loadComments(pid); }
    } catch (err) { console.error(err); t.disabled = false; t.textContent = "삭제하지 못했어요"; }
    return;
  }
  if (t.dataset.member && t.dataset.uid) {
    const kind = t.dataset.member;
    if ((kind === "ban" || (kind === "warn" && Number(t.dataset.w) === MAX_WARNS - 1)) && t.dataset.armed !== "1") {
      t.dataset.armed = "1"; t.textContent = "한 번 더 누르면 추방됩니다"; return;
    }
    t.disabled = true;
    try {
      const patch = kind === "warn" ? {warns: Number(t.dataset.w) + 1} : kind === "ban" ? {role:"banned"} : {role:"member", warns:0};
      await store.setMember(t.dataset.uid, patch);
      members = await store.members(); adminComments = await store.allComments(); render();
      const after = members.find(m => m.id === t.dataset.uid);
      analytics.track("member_action", { action: kind === "warn" && after && after.role === "banned" ? "auto_ban" : kind, warn_count: after ? (after.warns || 0) : undefined });
      msg("adminMsg", kind === "unban" ? "추방을 되돌렸습니다. 경고 횟수는 0으로 돌아갔어요." : after && after.role === "banned" ? "추방했습니다. 이 회원의 댓글은 다른 방문자에게 보이지 않아요." : "경고를 줬습니다.");
    } catch (err) { console.error(err); t.disabled = false; msg("adminMsg", "바꾸지 못했습니다. 관리자 계정인지 확인해 주세요.", true); }
  }
});

document.addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  if (f.id === "loginForm" && !$("lEmail")) { // 체험 모드 관리자: 비밀번호만
    const pw = $("lPw").value;
    if (!pw) return msg("loginMsg", "관리자 비밀번호를 입력해 주세요.", true);
    const b = $("loginSubmit"); b.disabled = true;
    try {
      user = await store.adminSignIn(pw); signupMode = false; afterLogin = "#";
      analytics.track("login", { method: "password", login_screen: "admin" });
      await refresh(); go("#admin");
    } catch (err) {
      b.disabled = false;
      msg("loginMsg", err && err.message === "admin_pw" ? "비밀번호가 맞지 않습니다. 다시 확인해 주세요." : "이 브라우저에서는 관리자 로그인을 할 수 없습니다. 다른 브라우저로 열어 주세요.", true);
    }
    return;
  }
  if (f.id === "loginForm") {
    const email = $("lEmail").value.trim(), pw = $("lPw").value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msg("loginMsg", "이메일 형식을 확인해 주세요. 예: name@example.com", true);
    if (pw.length < 6) return msg("loginMsg", "비밀번호는 6자 이상이어야 합니다.", true);
    const b = $("loginSubmit"); b.disabled = true;
    const adminScreen = parseRoute().name === "admin";
    try {
      const u = (signupMode && !adminScreen) ? await store.signUp(email, pw) : await store.signIn(email, pw);
      if (signupMode && !adminScreen) analytics.track("sign_up", { method: "email", needs_email_confirm: !u });
